<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Warp</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237b5cff'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='%230a0620' font-family='sans-serif' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================================
   WARP PROXY — shell styles (no tabs, single viewport)
   ========================================================================= */
:root{
  --bg:#04050e; --bg2:#080b1a; --panel:#0e1228; --panel2:#171c3a;
  --line:#232b58; --line2:#36407c;
  --text:#e9ecff; --muted:#98a2d6; --dim:#5e6797;
  --accent:#7b5cff; --accent2:#a48bff; --accentink:#0a0620;
  --purple:#c084fc; --cyan:#4dd0e1;
  --accent-rgb:123,92,255;
  --glow-a:123,92,255; --glow-b:88,166,255;
  --err:#fb7185; --warn:#fbbf24; --info:#58a6ff;
  --radius:10px; --radius-lg:16px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  --shadow:0 16px 50px rgba(0,0,0,.7),0 0 0 1px rgba(123,92,255,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c3856;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3c4a70;background-clip:content-box}

/* ---------------------------------------------------------------- stage --- */
#stage{position:fixed;top:var(--chrome,44px);left:0;right:0;bottom:0;background:#fff}
#view{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#view.on{display:block}
body.devtools #view{right:var(--devw,420px)}

/* -------------------------------------------------------------- toolbar --- */
#toolbar{
  position:fixed;top:0;left:0;right:0;height:44px;z-index:40;
  display:flex;align-items:center;gap:6px;padding:0 8px;
  background:linear-gradient(180deg,rgba(11,16,32,.98),rgba(11,16,32,.92));
  border-bottom:1px solid var(--line);
  transform:translateY(-46px);transition:transform .18s ease, right .18s ease;
  backdrop-filter:blur(10px);
}
body.devtools #toolbar{right:var(--devw,420px)}
#toolbar.show{transform:translateY(0)}
.tb-btn{
  flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;
  border:1px solid transparent;border-radius:8px;background:transparent;
  color:var(--muted);cursor:pointer;font-size:15px;line-height:1;user-select:none;
  transition:background .12s,color .12s,border-color .12s;
}
.tb-btn:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
.tb-btn:active{transform:scale(.94)}
.tb-btn[disabled]{opacity:.32;cursor:default;transform:none}
.tb-btn.accent{color:var(--accent)}
.tb-btn.stop{color:var(--err)}
.tb-sep{width:1px;height:20px;background:var(--line);margin:0 2px;flex:0 0 auto}

#omni{
  flex:1 1 auto;min-width:60px;height:32px;display:flex;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:0 4px 0 10px;transition:border-color .15s,box-shadow .15s;
}
#omni:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.22)}
#scheme{font-size:11px;color:var(--dim);margin-right:6px;font-family:var(--mono);flex:0 0 auto}
#omni input{
  flex:1 1 auto;min-width:0;height:100%;border:0;background:transparent;outline:0;
  font-size:13.5px;font-family:var(--mono);letter-spacing:-.1px;
}
#omni input::placeholder{color:var(--dim);font-family:var(--sans)}
#secure{flex:0 0 auto;font-size:11px;padding:0 6px;color:var(--accent);cursor:pointer}
#secure.warn{color:var(--warn)} #secure.bad{color:var(--err)}
#omnispin{display:none;width:12px;height:12px;border:2px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 6px}
#omnispin.on{display:block}
#goBtn{
  flex:0 0 auto;height:24px;padding:0 10px;margin-left:4px;border:0;border-radius:12px;
  background:var(--accent);color:var(--accentink);font-weight:700;font-size:11.5px;cursor:pointer;
}
#goBtn:hover{background:var(--accent2)}

/* ---------------------------------------------------------- progressbar --- */
#progress{position:fixed;top:44px;left:0;right:0;height:2px;z-index:45;pointer-events:none;opacity:0;transition:opacity .2s}
body.devtools #progress{right:var(--devw,420px)}
#progress.on{opacity:1;background:linear-gradient(90deg,transparent,var(--accent),var(--purple),transparent);
  background-size:45% 100%;background-repeat:no-repeat;animation:slide 1.05s linear infinite}
@keyframes slide{from{background-position:-45% 0}to{background-position:145% 0}}

/* --------------------------------------------------------------- toast --- */
#toast{
  position:fixed;left:50%;bottom:14px;z-index:60;max-width:min(560px,calc(100% - 24px));
  padding:9px 15px;border-radius:var(--radius);background:rgba(15,23,42,.97);
  border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;color:var(--text);
  pointer-events:none;opacity:0;transform:translateX(-50%) translateY(10px);
  transition:opacity .18s,transform .18s;line-height:1.45;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:rgba(248,113,113,.5);color:#fecaca}
#toast.ok{border-color:rgba(var(--accent-rgb),.5);color:#cfc4ff}
#toast.info{border-color:rgba(96,165,250,.5);color:#bfdbfe}

/* ------------------------------------------------------------ statusbar --- */
#statusbar{
  position:fixed;left:10px;bottom:10px;z-index:35;max-width:min(70vw,640px);
  padding:5px 11px;border-radius:8px;background:rgba(12,17,34,.95);
  border:1px solid var(--line);color:var(--muted);font-size:11.5px;font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s;pointer-events:none;
}
#statusbar.show{opacity:1;transform:translateY(0)}
body.devtools #statusbar{right:calc(var(--devw,420px) + 10px)}

/* ---------------------------------------------------------------- home --- */
#home{
  position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;padding:24px;text-align:center;overflow:auto;
  background:
    radial-gradient(900px 480px at 50% -10%,rgba(var(--glow-a),.16),transparent 60%),
    radial-gradient(700px 400px at 85% 110%,rgba(var(--glow-b),.13),transparent 60%),
    var(--bg);
}
#home.hidden{display:none}
#brand{font-size:clamp(34px,7vw,58px);font-weight:800;letter-spacing:-.03em;margin:0;
  background:linear-gradient(120deg,var(--cyan),var(--accent) 45%,var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#tagline{color:var(--muted);margin:6px 0 0;font-size:14px}
#homeForm{display:flex;gap:8px;width:100%;max-width:620px;margin-top:26px}
#homeInput{
  flex:1;min-width:0;height:52px;padding:0 20px;border-radius:26px;
  border:1px solid var(--line);background:var(--panel);font-size:16px;outline:0;
  transition:border-color .15s,box-shadow .15s;
}
#homeInput:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.20)}
#homeGo{height:52px;padding:0 26px;border:0;border-radius:26px;background:var(--accent);
  color:var(--accentink);font-weight:700;font-size:15px;cursor:pointer}
#homeGo:hover{background:var(--accent2)}
#homeGo:disabled{opacity:.5;cursor:default}
#statusMsg{margin-top:16px;font-size:12.5px;color:var(--muted);min-height:18px;
  max-width:620px;word-break:break-word}
#statusMsg.ok{color:var(--accent)}
#statusMsg.err{color:var(--err)}

#quick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:32px;max-width:700px}
.qchip{
  display:flex;flex-direction:column;align-items:center;gap:7px;width:80px;padding:12px 6px;
  border-radius:var(--radius-lg);border:1px solid transparent;cursor:pointer;user-select:none;
  background:transparent;transition:.15s;
}
.qchip:hover{background:var(--panel);border-color:var(--line);transform:translateY(-2px)}
.qico{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:var(--panel2);font-size:18px;font-weight:700;color:var(--accent);
  border:1px solid var(--line);overflow:hidden}
.qico .qlet{position:absolute;inset:0;display:grid;place-items:center}
.qico img{position:relative;width:22px;height:22px;object-fit:contain;border-radius:4px}
.qname{font-size:11px;color:var(--muted);max-width:74px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#recent{margin-top:22px;display:none;flex-wrap:wrap;gap:6px;justify-content:center;max-width:700px}
#recent.show{display:flex}
.rchip{display:flex;align-items:center;gap:7px;max-width:190px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11.5px;cursor:pointer}
.rchip:hover{border-color:var(--accent);color:var(--text)}
.rchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint{margin-top:28px;font-size:11.5px;color:var(--dim);line-height:1.9}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--panel2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}
#homeTop{position:absolute;top:14px;right:16px;display:flex;gap:6px}

/* --------------------------------------------------------------- panel --- */
#devtools{
  position:fixed;top:0;right:0;bottom:0;width:var(--devw,420px);z-index:50;
  background:var(--bg2);border-left:1px solid var(--line);display:none;flex-direction:column;
  box-shadow:-16px 0 40px rgba(0,0,0,.4);
}
body.devtools #devtools{display:flex}
#devtools header{display:flex;align-items:center;gap:4px;padding:8px 8px;border-bottom:1px solid var(--line);flex:0 0 auto}
#devtools header .t{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-right:auto;padding-left:6px}
.devtab{border:0;background:transparent;color:var(--dim);font-size:11.5px;padding:5px 9px;border-radius:7px;cursor:pointer;font-weight:600}
.devtab:hover{background:var(--panel2);color:var(--text)}
.devtab.active{background:var(--panel2);color:var(--accent)}
#devbody{flex:1 1 auto;overflow:auto;padding:0}
.dewpane{display:none;padding:10px}
.dewpane.active{display:block}
.devtool{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.warp{border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px;
  padding:4px 9px;border-radius:6px;cursor:pointer}
.warp:hover{background:var(--panel2);color:var(--text)}
.warp.danger:hover{border-color:var(--err);color:var(--err)}
.warp.on{border-color:var(--accent);color:var(--accent)}

.row{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;font-size:12px;
  font-family:var(--mono);border-bottom:1px solid rgba(40,50,77,.5)}
.row:hover{background:var(--panel)}
.mth{font-weight:700;font-size:10.5px;padding:1px 5px;border-radius:4px;background:var(--panel2);flex:0 0 auto}
.mth.GET{color:var(--accent)} .mth.POST{color:var(--warn)} .mth.PUT,.mth.PATCH{color:var(--info)}
.mth.DELETE{color:var(--err)}
.st{font-size:11px;flex:0 0 auto;color:var(--muted)}
.st.ok{color:var(--accent)} .st.redir{color:var(--info)} .st.err{color:var(--err)}
.neturl{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11.5px}
.msz{font-size:10.5px;color:var(--dim);flex:0 0 auto}

.log{font-family:var(--mono);font-size:11.5px;padding:4px 6px;border-bottom:1px solid rgba(40,50,77,.45);
  white-space:pre-wrap;word-break:break-word;line-height:1.45}
.log.err{color:#fca5a5} .log.warn{color:#fcd34d} .log.info{color:#93c5fd} .log.debug{color:var(--dim)}
.log .src{color:var(--dim);font-size:10px;display:block;margin-top:2px}

label.opt{display:flex;align-items:center;gap:9px;padding:8px 6px;font-size:12.5px;
  border-bottom:1px solid rgba(40,50,77,.5);cursor:pointer}
label.opt .lbl{flex:1 1 auto}
label.opt .sub{font-size:10.5px;color:var(--dim);display:block}
label.opt input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
label.opt input[type=text],label.opt select{
  flex:1 1 60px;max-width:200px;height:26px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:0 8px;font-size:11.5px;font-family:var(--mono);outline:0;
}
h4.sec{margin:14px 6px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.kv{display:flex;gap:8px;font-size:11.5px;font-family:var(--mono);padding:4px 6px;border-bottom:1px solid rgba(40,50,77,.4)}
.kv .kk{color:var(--dim);flex:0 0 42%;word-break:break-all}
.kv .vv{color:var(--text);flex:1 1 auto;word-break:break-all}

/* ------------------------------------------------------------- findbar --- */
#findbar{
  position:fixed;top:52px;right:18px;z-index:55;display:none;align-items:center;gap:6px;
  background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px 8px;
  box-shadow:var(--shadow);
}
body.devtools #findbar{right:calc(var(--devw,420px) + 18px)}
#findbar.show{display:flex}
#findbar input{height:28px;width:190px;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:0 10px;font-size:13px;outline:0}
#findbar input:focus{border-color:var(--accent)}
#findcount{font-size:11px;color:var(--muted);min-width:52px;text-align:center;font-family:var(--mono)}

/* ---------------------------------------------------------- contextmenu --- */
#ctx{
  position:fixed;z-index:70;display:none;min-width:200px;padding:5px;
  background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);
  font-size:12.5px;
}
#ctx.show{display:block}
#ctx .ci{padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--text);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:300px}
#ctx .ci:hover{background:var(--panel2)}
#ctx .ci.dim{color:var(--dim)}
#ctx .csep{height:1px;background:var(--line);margin:4px 6px}

/* ------------------------------------------------------------- overlay --- */
#sheet{
  position:fixed;inset:0;z-index:80;background:rgba(6,10,22,.72);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:24px;
}
#sheet.show{display:flex;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
#sheetCard{width:min(760px,100%);max-height:84vh;display:flex;flex-direction:column;
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
#sheetCard header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#sheetCard header .t{font-weight:700;font-size:14px;margin-right:auto}
#sheetBody{padding:14px;overflow:auto}
#sheetBody pre{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;
  max-height:56vh;overflow:auto;line-height:1.5}
.hlist{display:flex;flex-direction:column;gap:2px}
.hitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.hitem:hover{background:var(--panel)}
.hitem .hu{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-family:var(--mono);font-size:11.5px}
.hitem .ht{font-weight:600;flex:0 0 auto;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .hd{color:var(--dim);font-size:10.5px;flex:0 0 auto}
.mi{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.mi:hover{background:var(--panel2)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:30px 10px}
.help{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:12.5px;align-items:center}
.help kbd{white-space:nowrap}

/* ---------------------------------------------------------- errorpage ---- */
#errpage{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:var(--bg);z-index:5;text-align:center;padding:30px}
#errpage.show{display:flex}
#errpage .big{font-size:44px;font-weight:800;color:var(--line2);letter-spacing:-.04em}
#errpage h2{margin:14px 0 6px;font-size:19px}
#errpage .u{color:var(--muted);font-family:var(--mono);font-size:12px;word-break:break-all;max-width:560px}
#errpage .m{color:var(--err);font-size:12.5px;margin-top:10px;font-family:var(--mono);max-width:560px;word-break:break-all}
#errpage .actions{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:9px 16px;
  border-radius:9px;font-size:13px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--panel2);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accentink);border-color:transparent}
.btn.primary:hover{background:var(--accent2)}

@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;
  background:var(--panel2);color:var(--muted);border:1px solid var(--line);vertical-align:1px}
.hidden{display:none!important}
#tbStar.starred{color:#facc15}

@media (max-width:760px){
  #devtools{width:100%}
  body.devtools #view,body.devtools #toolbar,body.devtools #progress,body.devtools #statusbar{right:0}
  #devtools{box-shadow:none}
}
</style>
</head>
<body>

<!-- ============================== STAGE ============================== -->
<div id="stage">
  <iframe id="view"
    sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals allow-pointer-lock allow-presentation"
    allow="clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen; autoplay; encrypted-media; picture-in-picture; payment; midi"
    referrerpolicy="no-referrer"></iframe>

  <div id="errpage">
    <div class="big">:(</div>
    <h2 id="errTitle">Can't reach this page</h2>
    <div class="u" id="errUrl"></div>
    <div class="m" id="errMsg"></div>
    <div class="actions">
      <button class="btn primary" id="errRetry">Retry</button>
      <button class="btn" id="errHome">Home</button>
      <button class="btn" id="errInfo">Details</button>
    </div>
  </div>
</div>

<div id="statusbar"></div>

<!-- ============================== TOOLBAR ============================= -->
<div id="toolbar">
  <button class="tb-btn" id="tbBack"    title="Back (Alt+Left)">&#8592;</button>
  <button class="tb-btn" id="tbFwd"     title="Forward (Alt+Right)">&#8594;</button>
  <button class="tb-btn" id="tbReload"  title="Reload (Ctrl+R)">&#8635;</button>
  <button class="tb-btn" id="tbHome"    title="Home (Alt+Home)">&#8962;</button>
  <div class="tb-sep"></div>
  <div id="omni">
    <span id="scheme">https://</span>
    <span id="secure" title="Connection info">&#9679;</span>
    <input id="omniInput" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Search or enter address">
    <span id="omnispin"></span>
    <button id="goBtn">Go</button>
  </div>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="tbStar"    title="Bookmark (Ctrl+D)">&#9734;</button>
  <button class="tb-btn" id="tbFind"    title="Find in page (Ctrl+F)">&#9906;</button>
  <button class="tb-btn" id="tbZoom"    title="Reset zoom" style="width:auto;padding:0 7px;font-size:11.5px;font-family:var(--mono)">100%</button>
  <button class="tb-btn" id="tbMenu"    title="Menu">&#9776;</button>
  <button class="tb-btn accent" id="tbDev" title="DevTools (F12)">&#9635;</button>
</div>

<!-- ============================== HOME =============================== -->
<div id="home">
  <div id="homeTop">
    <button class="tb-btn" id="homeHist" title="History">&#9201;</button>
    <button class="tb-btn" id="homeBook" title="Bookmarks">&#9733;</button>
    <button class="tb-btn" id="homeDl"   title="Downloads">&#8681;</button>
    <button class="tb-btn" id="homeHelp" title="Shortcuts (F1)">?</button>
    <button class="tb-btn accent" id="homeDev" title="DevTools">&#9635;</button>
  </div>
  <h1 id="brand">Warp</h1>
  <p id="tagline">a single-file, no-tabs proxy. [Built by BGS Labs]</p>

/* ---------------------------------------------------------- inject build - */
function buildInject(url, referrer, origin) {
  const src = '(' + AGENT.toString() + ')(' + JSON.stringify(state.token) + ',' +
    JSON.stringify({ url, referrer: referrer || '', origin }) + ');';
  return '<script>' + src.replace(/<\/script/gi, '<\\/script') + '<\/script>';
}

function rewriteJs(code) {
  if (!code) return code;
  if (code.indexOf('location') >= 0) {
    code = code.replace(/(?<![\w$.])(?:(?:window|self|globalThis|document)\s*\.\s*)?location(?=\s*\.\s*(?:href|origin|host|hostname|port|pathname|search|hash|protocol|assign|replace|reload|toString)\b)/g, '__wpL');
    code = code.replace(/(?<![\w$.])(?:window|self|globalThis|document)\s*\.\s*location\s*=(?![=>])/g, '__wpL.href=');
  }
  const CMT = '<' + '!--';
  if (code.indexOf(CMT) >= 0 && code.toLowerCase().indexOf('<' + 'script') >= 0) code = code.split(CMT).join('<\\' + '!--');
  return code;
}

/* ========================================================= HTML PROCESSING = */
async function processHtml(html, url, depth = 0) {
  const doc = new DOMParser().parseFromString(html, 'text/html');

  doc.querySelectorAll('noscript').forEach(n => {
    if (settings.javaScript) { n.remove(); return; }
    const frag = doc.createDocumentFragment();
    while (n.firstChild) frag.appendChild(n.firstChild);
    n.replaceWith(frag);
  });

  let refresh = null;
  const mr = doc.querySelector('meta[http-equiv="refresh" i]');
  if (mr) {
    const m = /^\s*([\d.]*)\s*[;,]?\s*(?:url\s*=\s*)?['"]?\s*([^'"]*)/i.exec(mr.getAttribute('content') || '');
    const u = m && m[2] && resolveUrl(decodeEntities(m[2].trim()), url);
    if (u) refresh = { url: u, delay: parseFloat(m[1]) || 0 };
    mr.remove();
  }

  const baseEl = doc.querySelector('base[href]');
  const base = (baseEl && resolveUrl(baseEl.getAttribute('href'), url)) || url;
  doc.querySelectorAll('base').forEach(n => n.remove());

  doc.querySelectorAll('meta[http-equiv]').forEach(m => {
    const hv = (m.getAttribute('http-equiv') || '').toLowerCase();
    if (settings.stripCsp && (hv === 'content-security-policy' || hv === 'content-security-policy-report-only')) m.remove();
    if (hv === 'x-frame-options' || hv === 'x-ua-compatible' || hv === 'refresh' || hv === 'origin-trial') m.remove();
  });

  doc.querySelectorAll('[integrity]').forEach(n => n.removeAttribute('integrity'));
  doc.querySelectorAll('[crossorigin]').forEach(n => n.removeAttribute('crossorigin'));
  doc.querySelectorAll('[referrerpolicy]').forEach(n => n.removeAttribute('referrerpolicy'));

  doc.querySelectorAll('link[rel~="preconnect" i], link[rel~="dns-prefetch" i], link[rel~="prefetch" i], link[rel~="preload" i][as]').forEach(n => {
    const as = (n.getAttribute('as') || '').toLowerCase();
    if (as === 'script' || as === 'style' || as === 'font') n.remove();
  });

  // ---- image blocking -------------------------------------------------
  if (!settings.images) {
    doc.querySelectorAll('img').forEach(img => {
      const src = img.getAttribute('src');
      if (src && !/^data:/.test(src)) { img.setAttribute('data-src', src); img.setAttribute('src', PIXEL); }
      img.removeAttribute('srcset');
      img.removeAttribute('data-srcset');
    });
  }

  // ---- media unblocking ----------------------------------------------
  if (settings.unblockMedia) {
    doc.querySelectorAll('video,audio').forEach(m => {
      if (m.tagName === 'VIDEO') { m.setAttribute('playsinline', ''); if (!m.hasAttribute('controls')) m.setAttribute('controls', ''); }
      if (!m.hasAttribute('preload')) m.setAttribute('preload', 'metadata');
    });
  }

  const jobs = [];
  const late = [];

  if (settings.inlineCss) {
    doc.querySelectorAll('link[rel~="stylesheet" i]:not([rel~="alternate" i])[href]').forEach(l => {
      const u = resolveUrl(l.getAttribute('href'), base);
      if (!u) { l.remove(); return; }
      jobs.push((async () => {
        try {
          const css = await fetchText(u, url);
          if (typeof css !== 'string') return;
          const st = doc.createElement('style');
          st.textContent = await inlineCss(css, u);
          const media = l.getAttribute('media');
          if (media) st.setAttribute('media', media);
          const id = l.getAttribute('id');
          if (id) st.setAttribute('id', id);
          l.replaceWith(st);
        } catch {}
      })());
    });
  }

  doc.querySelectorAll('style').forEach(s => {
    jobs.push(inlineCss(s.textContent, base).then(c => { s.textContent = c; }, () => {}));
  });

  if (settings.inlineJs && settings.javaScript) {
    doc.querySelectorAll('script[src]').forEach(s => {
      const t = (s.getAttribute('type') || '').toLowerCase().trim();
      const isModule = t === 'module';
      if (t && !isModule && !/^(text|application)\/(x-)?(javascript|ecmascript|jscript)\s*(;.*)?$/.test(t)) return;
      if (s.hasAttribute('nomodule')) { s.remove(); return; }
      const u = resolveUrl(s.getAttribute('src'), base);
      if (!u) return;
      jobs.push((async () => {
        try {
          const code = await fetchText(u, url);
          if (typeof code !== 'string') return;
          if (code.length > settings.maxInlineBytes) return;
          if (isModule && /\bimport\b|\bexport\b[^;{]*\bfrom\b/.test(code)) return;
          s.setAttribute('data-wp-src', u);
          s.removeAttribute('src');
          s.removeAttribute('async');
          s.textContent = code.replace(/<\/script/gi, '<\\/script');
          if (!isModule && s.hasAttribute('defer')) { s.removeAttribute('defer'); late.push(s); }
        } catch {}
      })());
    });
  } else if (!settings.javaScript) {
    doc.querySelectorAll('script').forEach(s => s.remove());
    doc.querySelectorAll('*').forEach(el => {
      [...el.attributes].forEach(at => { if (/^on/i.test(at.name)) el.removeAttribute(at.name); });
    });
  }

  if (settings.inlineFrames && depth < settings.frameDepth) {
    doc.querySelectorAll('iframe[src]').forEach(f => {
      const raw = (f.getAttribute('src') || '').trim();
      if (!raw || /^about:|^javascript:|^data:/.test(raw)) return;
      const u = resolveUrl(raw, base);
      if (!u || !isHttp(u)) return;
      jobs.push((async () => {
        try {
          const res = await limit(() => request(u, {}, url));
          const ct = (res.headers.get('content-type') || '').toLowerCase();
          if (!isHtmlType(ct)) return;
          const buf = await res.arrayBuffer();
          if (buf.byteLength > 3_500_000) return;
          const inner = await processHtml(decodeBody(buf, ct), res.url || u, depth + 1);
          f.removeAttribute('src');
          f.setAttribute('srcdoc', inner.html);
        } catch {}
      })());
    });
  }

  let done = 0;
  const total = jobs.length;
  if (total) jobs.forEach(j => j.then(() => setStatus(`Resources ${++done}/${total}…`)));
  await Promise.all(jobs);

  late.forEach(s => (doc.body || doc.documentElement).appendChild(s));

  if (settings.javaScript) {
    doc.querySelectorAll('script:not([src])').forEach(sc => {
      const t = (sc.getAttribute('type') || '').toLowerCase().trim();
      if (t && t !== 'module' && !/(javascript|ecmascript|jscript)/.test(t)) return;
      sc.textContent = rewriteJs(sc.textContent);
    });
    doc.querySelectorAll('*').forEach(el => {
      for (const at of [...el.attributes]) {
        if (/^on/i.test(at.name) && at.value.indexOf('location') >= 0) el.setAttribute(at.name, rewriteJs(at.value));
      }
    });
  }

  if (!doc.querySelector('meta[name="viewport" i]')) {
    const wp = doc.createElement('meta');
    wp.name = 'viewport';
    wp.content = 'width=device-width,initial-scale=1';
    (doc.head || doc.documentElement).appendChild(wp);
  }

  const doctype = /^\s*<!doctype/i.test(html) ? '<!DOCTYPE html>' : '';
  const inject = `<base href="${esc(base)}">` + buildInject(base, url, originOf(base));

  let out = doctype + doc.documentElement.outerHTML;
  out = out.replace(/<head([^>]*)>/i, (m, attrs) => m + inject);
  if (!/<head/i.test(out)) out = inject + out;
  return { html: out, refresh, base };
}

/* ---------------------------------------------------- CSS @import inliner - */
async function inlineCss(css, base, depth = 0) {
  const re = /@import\s+(?:url\(\s*)?['"]?([^'")\s;]+)['"]?\s*\)?([^;]*);/gi;
  const matches = [...css.matchAll(re)];
  for (const m of matches) {
    let replacement = '';
    if (depth < 4) {
      try {
        const u = resolveUrl(m[1], base);
        const sub = await fetchText(u, base);
        if (typeof sub === 'string') {
          replacement = await inlineCss(sub, u, depth + 1);
          const media = (m[2] || '').trim();
          if (media && !/layer|supports/i.test(media)) replacement = `@media ${media}{${replacement}}`;
        }
      } catch {}
    }
    css = css.replace(m[0], () => replacement);
  }
  return css.replace(/url\(\s*(['"]?)(?!data:|#|blob:)([^'")]+?)\1\s*\)/gi, (m, q, u) => {
    const a = resolveUrl(u.trim(), base);
    return a ? `url("${a}")` : m;
  });
}

/* ================================================================ NAV ===== */
async function navigate(target, opts = {}) {
  const { method = 'GET', body, contentType, push = true, replace = false,
          metaDepth = 0, referrer } = opts;

  if (!state.ready) { state.pendingBoot = { target, opts }; setStatus('Waiting for runtime…'); return; }

  const my = ++state.navToken;
  setLoading(true);
  setStatus('Loading ' + shortUrl(target, 60) + '…');
  errpage.classList.remove('show');

  try {
    // ---- view-source: ---------------------------------------------------
    if (/^view-source:/i.test(target)) {
      const inner = target.replace(/^view-source:/i, '');
      const res = await request(inner, {}, referrer);
      const text = decodeBody(await res.arrayBuffer(), res.headers.get('content-type'));
      state.lastRawHtml = text;
      const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>view-source:${esc(inner)}</title>
        <style>body{margin:0;background:#0b1020;color:#d7dcff}pre{margin:0;padding:16px;font:12.5px/1.5 ${'var(--mono),monospace'};white-space:pre-wrap;word-break:break-word}</style>
        </head><body><pre>${esc(text)}</pre></body></html>`;
      showPage({ html });
      showHome(false);
      pushHistory({ url: target, title: 'view-source:' + shortUrl(inner, 50) }, push, replace);
      syncChrome(target, null);
      setStatus('');
      return;
    }

    const init = { method };
    if (body != null && method !== 'GET' && method !== 'HEAD') {
      init.body = body;
      if (contentType) init.contentType = contentType;
    }
    const ref = referrer || (state.hIndex >= 0 ? state.history[state.hIndex].url : undefined);

    let currentUrl = target;
    let res;
    for (;;) {
      res = await request(currentUrl, init, ref);
      if (my !== state.navToken) return;

      const refreshHdr = res.headers.get('refresh');
      if (refreshHdr && metaDepth < settings.metaRefreshDepth) {
        const m = /url=\s*['"]?([^'";]+)/i.exec(refreshHdr);
        const u = m && resolveUrl(m[1], res.url || currentUrl);
        if (u) { currentUrl = u; continue; }
      }
      break;
    }

    const finalUrl = res.url || currentUrl;
    const ctype = (res.headers.get('content-type') || '').toLowerCase();
    const disp = res.headers.get('content-disposition') || '';

    const buf = await res.arrayBuffer();
    if (my !== state.navToken) return;

    if (/attachment/i.test(disp)) {
      const name = filenameFrom(disp, finalUrl);
      saveBlob(new Blob([buf], { type: ctype }), name);
      setLoading(false);
      setStatus('Downloaded ' + name, 'ok');
      toast('Downloaded ' + name, 'ok');
      return;
    }

    let page;
    if (isHtmlType(ctype)) {
      state.lastRawHtml = decodeBody(buf, ctype);
      const processed = await processHtml(state.lastRawHtml, finalUrl);
      if (my !== state.navToken) return;
      if (processed.refresh && !processed.refresh.delay &&
          processed.refresh.url !== finalUrl && metaDepth < settings.metaRefreshDepth) {
        return navigate(processed.refresh.url, { push, metaDepth: metaDepth + 1 });
      }
      page = { html: processed.html };
      state.currentMeta = { url: finalUrl, status: res.status, type: ctype, base: processed.base };
      if (processed.refresh && processed.refresh.delay && metaDepth < settings.metaRefreshDepth) {
        setTimeout(() => { if (my === state.navToken) navigate(processed.refresh.url, { metaDepth: metaDepth + 1 }); },
          Math.min(processed.refresh.delay, 30) * 1000);
      }
    } else if (isBinaryView(ctype) || isTextual(ctype)) {
      state.lastRawHtml = '';
      page = { blob: new Blob([buf], { type: ctype || 'application/octet-stream' }) };
      state.currentMeta = { url: finalUrl, status: res.status, type: ctype };
    } else {
      const name = filenameFrom(disp, finalUrl);
      saveBlob(new Blob([buf], { type: ctype }), name);
      setLoading(false);
      setStatus('Downloaded ' + name, 'ok');
      return;
    }

    pushHistory({ url: finalUrl, method, body, contentType, title: '' }, push, replace);
    showPage(page);
    showHome(false);
    syncChrome(finalUrl, res);
    if (res.status >= 400) toast('HTTP ' + res.status + ' ' + (res.statusText || ''), 'err');
    else if (finalUrl !== target) toast('Redirected → ' + shortUrl(finalUrl, 50), 'info');
    else setStatus('');
  } catch (err) {
    if (my !== state.navToken) return;
    showError(target, err);
  } finally {
    if (my === state.navToken) setLoading(false);
  }
}

function pushHistory(entry, push, replace) {
  entry.at = Date.now();
  const prev = state.history[state.hIndex];
  if (prev && !push && !replace) { state.history[state.hIndex] = entry; saveHistory(); return; }
  if (replace && state.hIndex >= 0) state.history[state.hIndex] = entry;
  else {
    state.history = state.history.slice(0, state.hIndex + 1);
    state.history.push(entry);
    state.hIndex = state.history.length - 1;
    if (state.history.length > 500) { state.history.shift(); state.hIndex--; }
  }
  saveHistory();
}
function saveHistory() {
  saveJSON('wp.history', { list: state.history.slice(-250), idx: state.hIndex });
}
function restoreHistory() {
  const saved = loadJSON('wp.history', null);
  if (saved && Array.isArray(saved.list) && saved.list.length) {
    state.history = saved.list;
    state.hIndex = Math.min(Math.max(0, saved.idx | 0), saved.list.length - 1);
  }
}

function showPage(page) {
  if (state.blobUrl) { URL.revokeObjectURL(state.blobUrl); state.blobUrl = null; }
  if (page.html != null) {
    view.removeAttribute('src');
    view.srcdoc = page.html;
  } else {
    state.blobUrl = URL.createObjectURL(page.blob);
    view.removeAttribute('srcdoc');
    view.src = state.blobUrl;
  }
  view.classList.add('on');
}

function showHome(on) {
  home.classList.toggle('hidden', !on);
  toolbar.classList.toggle('show', !on);
  if (on) { homeInput.focus(); homeInput.select(); renderQuick(); renderRecent(); }
}

function showError(target, err) {
  const msg = String((err && err.message) || err);
  state.lastError = { target, msg, at: Date.now() };
  $('errUrl').textContent = target;
  $('errMsg').textContent = msg;
  errpage.classList.add('show');
  if (state.hIndex < 0 || state.history[state.hIndex].url !== target) {
    pushHistory({ url: target, method: 'GET', title: '' }, true, false);
  }
  showHome(false);
  syncChrome(target, null);
  setStatus('Failed: ' + msg, 'err');
}

function syncChrome(url, res) {
  const u = String(url || '');
  schemeEl.textContent = (u.match(/^([a-z-]+):/i) || [, 'https'])[1] + '://';
  omniInput.value = u;
  if (/^https:/i.test(u)) { secureEl.textContent = '🔒'; secureEl.className = ''; secureEl.title = 'Secure connection'; }
  else if (/^http:/i.test(u)) { secureEl.textContent = '!'; secureEl.className = 'warn'; secureEl.title = 'Not secure'; }
  else { secureEl.textContent = '·'; secureEl.className = 'bad'; secureEl.title = 'Unknown scheme'; }
  $('tbBack').disabled = state.hIndex <= 0;
  $('tbFwd').disabled = state.hIndex >= state.history.length - 1;
  document.title = (state.history[state.hIndex] && state.history[state.hIndex].title) || 'Warp Proxy';
  updateStar();
  renderInfo();
}

/* ============================================================ MESSAGES ==== */
const wsSockets = new Map();
const abortMap = new Map();

function replyTo(src, msg, transfer) {
  try { src.postMessage(Object.assign({ [TAG]: state.token }, msg), '*', transfer || []); } catch {}
}

window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d[TAG] !== state.token) return;
  const src = e.source;
  if (!src) return;

  switch (d.type) {
    case 'nav':
      if (!isHttp(d.url)) break;
      navigate(d.url, { method: d.method || 'GET', body: d.body, contentType: d.contentType, referrer: d.referrer });
      break;
    case 'open': if (isHttp(d.url)) navigate(d.url, { push: true }); break;
    case 'popupDoc': handlePopupDoc(d); break;
    case 'alert': toast(d.message); break;
    case 'download': downloadUrl(d.url, d.name); break;
    case 'reload': reload(); break;
    case 'hash':
      if (state.hIndex >= 0) { state.history[state.hIndex].url = d.url; saveHistory(); }
      if (document.activeElement !== omniInput) omniInput.value = d.url;
      updateStar();
      break;
    case 'key': handleKey(d); break;
    case 'wheel': setZoom(state.zoom + d.dir * 0.1); break;
    case 'fetch': handleFetch(d, src); break;
    case 'fetchAbort': {
      const c = abortMap.get(d.id);
      if (c) { try { c.abort(); } catch {} abortMap.delete(d.id); }
      break;
    }
    case 'wsOpen': handleWsOpen(d, src); break;
    case 'wsSend': handleWsSend(d); break;
    case 'wsClose': handleWsClose(d); break;
    case 'storeSet': storeSet(d); break;
    case 'storeRemove': storeRemove(d); break;
    case 'storeClear': storeClear(d); break;
    case 'cookieSet': {
      const u = state.currentMeta ? state.currentMeta.url : '';
      cookieJar.writeDocumentCookie(u, d.value);
      break;
    }
    case 'console': pushConsole({ level: d.level, text: (d.args || []).join(' '), src: d.src, at: Date.now() }); break;
    case 'title': {
      if (state.hIndex >= 0) {
        state.history[state.hIndex].title = String(d.title || '').slice(0, 160);
        document.title = String(d.title || 'Warp Proxy').slice(0, 160);
        saveHistory();
      }
      break;
    }
    case 'favicon': setFavicon(d.url); break;
    case 'hover': showStatusbar(d.url || ''); break;
    case 'scroll': renderInfo(); break;
    case 'ctxmenu': showCtx(d); break;
    case 'findResult': onFindResult(d); break;
    case 'frameReady': seedFrame(); break;
    case 'clipboard': onClipboard(d); break;
    case 'historyBack': goBack(); break;
    case 'historyForward': goForward(); break;
    case 'childMessage': toast('postMessage: ' + JSON.stringify(d.data).slice(0, 80)); break;
    case 'close': toast('window.close() — single view'); break;
    case 'share': toast('Shared: ' + JSON.stringify(d.data).slice(0, 80)); break;
    case 'pagehide': break;
  }
});

async function handlePopupDoc(d) {
  try {
    const base = d.url || curUrl() || 'about:blank';
    const processed = await processHtml(d.html || '', base);
    showPage({ html: processed.html });
    showHome(false);
    pushHistory({ url: base, title: '(popup)', popup: true }, true, false);
    syncChrome(base, null);
    toast('Popup rendered in this view', 'info');
  } catch (e) {
    toast('Popup render failed', 'err');
  }
}

function seedFrame() {
  const o = curOrigin();
  if (!o) return;
  try {
    const w = view.contentWindow;
    if (!w) return;
    w.postMessage({ [TAG]: state.token, type: 'storeData', area: 'local', data: originStore.get(o, 'local') }, '*');
    w.postMessage({ [TAG]: state.token, type: 'storeData', area: 'session', data: originStore.get(o, 'session') }, '*');
    w.postMessage({ [TAG]: state.token, type: 'cookieData', value: cookieJar.documentCookie(state.currentMeta ? state.currentMeta.url : o) }, '*');
  } catch {}
}

/* ------------------------------------------------------------- fetch tun - */
async function handleFetch(d, src) {
  const id = d.id;
  const controller = new AbortController();
  abortMap.set(id, controller);
  const init = d.init || {};
  const ref = state.hIndex >= 0 ? state.history[state.hIndex].url : undefined;

  try {
    const res = await limit(() => request(d.url, {
      method: init.method, headers: init.headers, body: init.body, signal: controller.signal,
    }, ref));

    replyTo(src, { type: 'fetchHead', id, status: res.status, statusText: res.statusText || '',
                   headers: [...res.headers], url: res.url });

    let reader = null;
    try { if (res.body && res.body.getReader) reader = res.body.getReader(); } catch {}

    if (reader) {
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        if (value) {
          const ab = value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength);
          replyTo(src, { type: 'fetchChunk', id, chunk: ab }, [ab]);
        }
      }
    } else {
      const buf = await res.arrayBuffer();
      replyTo(src, { type: 'fetchChunk', id, chunk: buf }, [buf]);
    }
    replyTo(src, { type: 'fetchEnd', id });
  } catch (e) {
    replyTo(src, { type: 'fetchError', id, error: String((e && e.message) || e) });
  } finally {
    abortMap.delete(id);
  }
}

/* ------------------------------------------------------------ websockets - */
function openSocket(url, protocols) {
  if (typeof libcurl !== 'undefined' && libcurl && libcurl.WebSocket) {
    try { return new libcurl.WebSocket(url, protocols); } catch {}
  }
  return new WebSocket(url, protocols);
}
function handleWsOpen(d, src) {
  try {
    const ws = openSocket(d.url, d.protocols);
    try { ws.binaryType = 'arraybuffer'; } catch {}
    wsSockets.set(d.id, ws);
    ws.onopen = () => replyTo(src, { type: 'wsOpen', id: d.id, protocol: ws.protocol || '' });
    ws.onmessage = ev => {
      const data = ev.data;
      if (typeof data === 'string') replyTo(src, { type: 'wsMessage', id: d.id, data, bin: false });
      else if (data instanceof ArrayBuffer) replyTo(src, { type: 'wsMessage', id: d.id, data, bin: true });
      else if (data && data.buffer) replyTo(src, { type: 'wsMessage', id: d.id, data: data.buffer, bin: true });
      else replyTo(src, { type: 'wsMessage', id: d.id, data: String(data), bin: false });
    };
    ws.onerror = () => replyTo(src, { type: 'wsError', id: d.id });
    ws.onclose = ev => { wsSockets.delete(d.id); replyTo(src, { type: 'wsClose', id: d.id, code: ev.code || 1000, reason: ev.reason || '', wasClean: ev.wasClean !== false }); };
  } catch (e) {
    replyTo(src, { type: 'wsError', id: d.id, error: String(e) });
  }
}
function handleWsSend(d) {
  const ws = wsSockets.get(d.id);
  if (!ws || ws.readyState !== 1) return;
  try { ws.send(d.data); } catch {}
}
function handleWsClose(d) {
  const ws = wsSockets.get(d.id);
  if (!ws) return;
  try { ws.close(d.code || 1000, d.reason || ''); } catch {}
  wsSockets.delete(d.id);
}

/* ------------------------------------------------------------- storage --- */
function curOrigin() {
  const u = state.currentMeta ? state.currentMeta.url : (state.hIndex >= 0 ? state.history[state.hIndex].url : '');
  return originOf(u);
}
function storeSet(d) {
  const o = curOrigin(); if (!o || !settings.persistStorage) return;
  const area = d.area === 'session' ? 'session' : 'local';
  const data = originStore.get(o, area);
  data[d.key] = d.value;
  originStore.set(o, area, data);
}
function storeRemove(d) {
  const o = curOrigin(); if (!o) return;
  const area = d.area === 'session' ? 'session' : 'local';
  const data = originStore.get(o, area);
  delete data[d.key];
  originStore.set(o, area, data);
}
function storeClear(d) {
  const o = curOrigin(); if (!o) return;
  const area = d.area === 'session' ? 'session' : 'local';
  originStore.set(o, area, {});
}

/* ------------------------------------------------------------- console --- */
const consoleLog = [];
function pushConsole(e) {
  consoleLog.push(e);
  if (consoleLog.length > 600) consoleLog.shift();
  renderConsole();
}

/* ---------------------------------------------------------- find / clip -- */
function onFindResult(d) {
  if (d.op === 'search' || d.op === 'next' || d.op === 'prev') {
    $('findcount').textContent = d.count ? (d.index + 1) + '/' + d.count : '0/0';
  }
}
function onClipboard(d) {
  if (d.op === 'write' && navigator.clipboard) navigator.clipboard.writeText(d.text).catch(() => {});
  if (d.op === 'copy') toast('Copied', 'ok');
}

/* ============================================================== ACTIONS === */
function normalizeInput(raw) {
  const input = String(raw || '').trim();
  if (!input) return null;
  if (/^(about|data|blob|javascript|view-source):/i.test(input)) return input;
  if (/^https?:\/\//i.test(input)) return input;
  if (/^\/\//.test(input)) return 'https:' + input;
  const noSpace = !/\s/.test(input);
  const looksHost = /^(localhost|(\d{1,3}\.){3}\d{1,3}|[a-z0-9-]+(\.[a-z0-9-]+)+)(:\d+)?([/?#].*)?$/i.test(input);
  if (noSpace && looksHost) {
    const local = /^(localhost|(\d{1,3}\.){3}\d{1,3})/i.test(input);
    return (local ? 'http://' : 'https://') + input;
  }
  return settings.searchEngine.replace('%s', encodeURIComponent(input));
}

function stop() { state.navToken++; setLoading(false); }
function goBack() {
  if (state.hIndex <= 0) return;
  state.hIndex--;
  const h = state.history[state.hIndex];
  navigate(h.url, Object.assign({}, h, { push: false }));
}
function goForward() {
  if (state.hIndex >= state.history.length - 1) return;
  state.hIndex++;
  const h = state.history[state.hIndex];
  navigate(h.url, Object.assign({}, h, { push: false }));
}
function reload() {
  if (state.hIndex < 0) return;
  const h = state.history[state.hIndex];
  navigate(h.url, Object.assign({}, h, { push: false }));
}
function hardReload() { memCache.clear(); reload(); toast('Hard reload', 'info'); }

async function downloadUrl(url, name) {
  try {
    setStatus('Downloading…');
    const res = await request(url, {}, state.hIndex >= 0 ? state.history[state.hIndex].url : undefined);
    const blob = new Blob([await res.arrayBuffer()], { type: res.headers.get('content-type') || '' });
    saveBlob(blob, name || filenameFrom(res.headers.get('content-disposition'), res.url || url));
    setStatus('Download complete', 'ok');
    toast('Downloaded ' + (name || 'file'), 'ok');
  } catch (e) {
    setStatus('Download failed: ' + e.message, 'err');
  }
}

/* ------------------------------------------------------------------ zoom - */
const SUPPORTS_ZOOM = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('zoom', '1');
function setZoom(z) {
  state.zoom = Math.min(4, Math.max(0.25, Math.round(z * 100) / 100));
  if (SUPPORTS_ZOOM) {
    view.style.transform = '';
    view.style.width = '100%';
    view.style.height = '100%';
    view.style.zoom = state.zoom;
  } else {
    view.style.zoom = '';
    view.style.transform = 'scale(' + state.zoom + ')';
    view.style.transformOrigin = '0 0';
    view.style.width = (100 / state.zoom) + '%';
    view.style.height = (100 / state.zoom) + '%';
  }
  $('tbZoom').textContent = Math.round(state.zoom * 100) + '%';
  saveJSON('wp.zoom', state.zoom);
}

/* ----------------------------------------------------------------- find - */
function openFind() {
  state.findOpen = true;
  $('findbar').classList.add('show');
  $('findInput').focus();
  $('findInput').select();
}
function closeFind() {
  state.findOpen = false;
  $('findbar').classList.remove('show');
  sendToPage({ type: 'findCmd', op: 'clear' });
  $('findcount').textContent = '';
}
function sendToPage(msg, transfer) {
  try { view.contentWindow.postMessage(Object.assign({ [TAG]: state.token }, msg), '*', transfer || []); } catch {}
}
function runFind(op) {
  sendToPage({ type: 'findCmd', op, query: $('findInput').value, matchCase: state.findCase });
}

/* ---------------------------------------------------------------- panels - */
function openSheet(title, html) {
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = html;
  $('sheet').classList.add('show');
  return $('sheetBody');
}
function closeSheet() { $('sheet').classList.remove('show'); }

function renderQuick() {
  const wrap = $('quick');
  const bookmarks = loadJSON('wp.bookmarks', []).filter(b => b && b.url);
  const seen = new Set(bookmarks.map(b => bmKey(b.url)));
  const items = bookmarks.map(b => ({ name: b.name || hostOf(b.url), url: b.url, ico: b.ico }))
    .concat(QUICK_LINKS.filter(q => !seen.has(bmKey(q.url))))
    .slice(0, 8);
  wrap.innerHTML = items.map(b => {
    const name = b.name || hostOf(b.url);
    const letter = esc((name.trim()[0] || '?').toUpperCase());
    const isImg = b.ico && /^https?:/.test(b.ico);
    return `<button class="qchip" data-url="${esc(b.url)}" title="${esc(b.url)}">
      <span class="qico"><span class="qlet">${letter}</span>${isImg ? `<img src="${esc(b.ico)}" alt="" onerror="this.remove()">` : ''}</span>
      <span class="qname">${esc(name)}</span></button>`;
  }).join('');
  wrap.querySelectorAll('.qchip').forEach(c => c.addEventListener('click', () => {
    const u = normalizeInput(c.dataset.url);
    if (u) navigate(u);
  }));
}

function renderRecent() {
  const el = $('recent');
  const seen = new Set();
  const items = [];
  for (let i = state.history.length - 1; i >= 0 && items.length < 6; i--) {
    const h = state.history[i];
    if (!h || !h.url || seen.has(h.url)) continue;
    seen.add(h.url);
    items.push(h);
  }
  if (!items.length) { el.classList.remove('show'); return; }
  el.classList.add('show');
  el.innerHTML = items.map(h =>
    `<button class="rchip" data-url="${esc(h.url)}" title="${esc(h.url)}"><span>${esc(h.title || hostOf(h.url))}</span></button>`).join('');
  el.querySelectorAll('.rchip').forEach(c => c.addEventListener('click', () => navigate(c.dataset.url)));
}

function renderHistorySheet() {
  const items = state.history.slice().reverse();
  if (!items.length) { openSheet('History', '<div class="empty">No history yet.</div>'); return; }
  const body = openSheet('History',
    '<div style="margin-bottom:8px"><button class="warp danger" id="histClear">Clear history</button></div>' +
    '<div class="hlist">' + items.map((h, i) => `
    <div class="hitem" data-idx="${state.history.length - 1 - i}">
      <span class="ht">${esc(h.title || hostOf(h.url))}</span>
      <span class="hu">${esc(h.url)}</span>
      <span class="hd">${h.at ? new Date(h.at).toLocaleTimeString() : ''}</span>
    </div>`).join('') + '</div>');
  body.querySelector('#histClear').addEventListener('click', () => {
    state.history = []; state.hIndex = -1; saveHistory();
    renderHistorySheet(); renderRecent(); toast('History cleared');
  });
  body.querySelectorAll('.hitem').forEach(el => el.addEventListener('click', () => {
    const idx = parseInt(el.dataset.idx, 10);
    const h = state.history[idx];
    state.hIndex = idx;
    navigate(h.url, Object.assign({}, h, { push: false }));
    closeSheet();
  }));
}

function curUrl() {
  const h = state.hIndex >= 0 ? state.history[state.hIndex] : null;
  return h ? h.url : '';
}
function bmKey(u) {
  try { const x = new URL(u); x.hash = ''; return x.href.replace(/\/$/, ''); }
  catch { return String(u || '').replace(/#.*$/, '').replace(/\/$/, ''); }
}
function isBookmarked(u) {
  if (!u) return false;
  const k = bmKey(u);
  return loadJSON('wp.bookmarks', []).some(b => b && bmKey(b.url) === k);
}
function updateStar() {
  const el = $('tbStar');
  if (!el) return;
  const on = isBookmarked(curUrl());
  el.innerHTML = on ? '&#9733;' : '&#9734;';
  el.classList.toggle('starred', on);
  el.title = on ? 'Remove bookmark (Ctrl+D)' : 'Bookmark (Ctrl+D)';
}

function renderBookmarksSheet() {
  const bm = loadJSON('wp.bookmarks', []).filter(b => b && b.url);
  if (!bm.length) { openSheet('Bookmarks', '<div class="empty">No bookmarks. Press Ctrl+D or tap the star to add one.</div>'); return; }
  const body = openSheet('Bookmarks', '<div class="hlist">' + bm.map((b, i) => `
    <div class="hitem" data-i="${i}">
      <span class="ht">${esc(b.name || hostOf(b.url))}</span>
      <span class="hu">${esc(b.url)}</span>
      <button class="warp" data-ren="${i}">ren</button>
      <button class="warp danger" data-del="${i}">del</button>
    </div>`).join('') + '</div>');
  body.querySelectorAll('.hitem').forEach(el => el.addEventListener('click', ev => {
    const arr = loadJSON('wp.bookmarks', []).filter(b => b && b.url);
    const delBtn = ev.target.closest && ev.target.closest('[data-del]');
    const renBtn = ev.target.closest && ev.target.closest('[data-ren]');
    if (delBtn) {
      ev.stopPropagation();
      arr.splice(parseInt(delBtn.dataset.del, 10), 1);
      saveJSON('wp.bookmarks', arr);
      renderBookmarksSheet(); renderQuick(); updateStar();
      return;
    }
    if (renBtn) {
      ev.stopPropagation();
      const i = parseInt(renBtn.dataset.ren, 10);
      const name = prompt('Rename bookmark', arr[i].name || '');
      if (name != null) { arr[i].name = name.slice(0, 80); saveJSON('wp.bookmarks', arr); renderBookmarksSheet(); renderQuick(); }
      return;
    }
    const b = arr[parseInt(el.dataset.i, 10)];
    const t = b && normalizeInput(b.url);
    if (t) { closeSheet(); navigate(t); }
  }));
}

function renderDownloadsSheet() {
  if (!state.downloads.length) { openSheet('Downloads', '<div class="empty">No downloads yet.</div>'); return; }
  openSheet('Downloads', '<div class="hlist">' + state.downloads.map(d => `
    <div class="hitem"><span class="ht">${esc(d.name)}</span>
      <span class="hu">${(d.size / 1024).toFixed(1)} KB</span>
      <a class="warp" href="${esc(d.url)}" download="${esc(d.name)}">save</a></div>`).join('') + '</div>');
}

function toggleBookmark() {
  const u = curUrl();
  if (!u) { toast('Nothing to bookmark yet', 'err'); return; }
  const k = bmKey(u);
  const arr = loadJSON('wp.bookmarks', []).filter(b => b && b.url);
  const i = arr.findIndex(b => bmKey(b.url) === k);
  if (i >= 0) { arr.splice(i, 1); toast('Bookmark removed'); }
  else {
    const h = state.history[state.hIndex];
    arr.push({ name: ((h && h.title) || hostOf(u)).slice(0, 80), url: u, ico: state.favicon || '' });
    toast('Bookmarked', 'ok');
  }
  saveJSON('wp.bookmarks', arr);
  renderQuick(); updateStar();
}

function addQuickLink() {
  const u = curUrl();
  if (!u) { toast('Nothing to add', 'err'); return; }
  const h = state.history[state.hIndex];
  const name = prompt('Quick link name', (h && h.title) || hostOf(u));
  if (name == null) return;
  const arr = loadJSON('wp.bookmarks', []);
  arr.push({ name: name.slice(0, 80), url: u, ico: state.favicon || '' });
  saveJSON('wp.bookmarks', arr);
  renderQuick(); toast('Added to quick links', 'ok');
}

function viewSource() {
  if (!state.lastRawHtml) { toast('No source captured', 'err'); return; }
  openSheet('View Source', '<pre id="srcPre"></pre>');
  $('srcPre').textContent = state.lastRawHtml;
}

function savePageSource() {
  if (!state.lastRawHtml) { toast('No source captured', 'err'); return; }
  const name = (document.title || hostOf(curUrl()) || 'page').replace(/[^\w.-]+/g, '_').slice(0, 60) + '.html';
  saveBlob(new Blob([state.lastRawHtml], { type: 'text/html' }), name);
  toast('Saved ' + name, 'ok');
}

function readerMode() {
  if (!state.lastRawHtml) { toast('No source captured', 'err'); return; }
  const doc = new DOMParser().parseFromString(state.lastRawHtml, 'text/html');
  let best = null, bestScore = 0;
  doc.querySelectorAll('article, main, [role="main"], .post, .content, .entry-content, #content, .article').forEach(el => {
    const score = (el.textContent || '').length;
    if (score > bestScore) { bestScore = score; best = el; }
  });
  if (!best) {
    doc.querySelectorAll('div, section').forEach(el => {
      const score = (el.textContent || '').trim().length - el.querySelectorAll('div').length * 20;
      if (score > bestScore) { bestScore = score; best = el; }
    });
  }
  if (!best) { toast('Could not extract article', 'err'); return; }
  const title = doc.title || '';
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>body{max-width:720px;margin:0 auto;padding:32px 20px;font:17px/1.7 Georgia,serif;color:#1a1a1a;background:#fafafa}
    img{max-width:100%;height:auto}h1,h2,h3{font-family:system-ui,sans-serif;line-height:1.3}
    a{color:#0a7}pre,code{font-family:monospace;background:#eee;padding:2px 4px}</style></head>
    <body><h1>${esc(title)}</h1>${best.innerHTML}</body></html>`;
  showPage({ html });
  showHome(false);
  toast('Reader mode', 'ok');
}

     ['Ctrl + D','Bookmark'],['Ctrl + U','View source'],['Ctrl + S','Save page source'],

/* ---------------------------------------------------------------- context */
function showCtx(d) {
  const ctx = $('ctx');
  const items = [];
  if (d.link) {
    items.push({ label: 'Open link', fn: () => navigate(d.link) });
    items.push({ label: 'Copy link address', fn: () => copyText(d.link) });
    items.push({ sep: true });
  }
  if (d.img) {
    items.push({ label: 'Open image', fn: () => navigate(d.img) });
    items.push({ label: 'Copy image address', fn: () => copyText(d.img) });
    items.push({ sep: true });
  }
  if (d.selection) {
    items.push({ label: 'Search for "' + shortUrl(d.selection, 24) + '"', fn: () => navigate(normalizeInput(d.selection)) });
    items.push({ label: 'Copy', fn: () => copyText(d.selection) });
    items.push({ sep: true });
  }
  items.push({ label: 'Back', dim: state.hIndex <= 0, fn: goBack });
  items.push({ label: 'Forward', dim: state.hIndex >= state.history.length - 1, fn: goForward });
  items.push({ label: 'Reload', fn: reload });
  items.push({ sep: true });
  items.push({ label: 'View source', fn: viewSource });
  items.push({ label: 'Reader mode', fn: readerMode });
  items.push({ label: 'Add to quick links', fn: addQuickLink });
  items.push({ label: 'Inspect (DevTools)', fn: openDevtools });

  ctx.innerHTML = items.map((i, n) => i.sep ? '<div class="csep"></div>'
    : `<div class="ci${i.dim ? ' dim' : ''}" data-i="${n}">${esc(i.label)}</div>`).join('');
  ctx.classList.add('show');
  const w = ctx.offsetWidth, h = ctx.offsetHeight;
  ctx.style.left = Math.min(d.x, innerWidth - w - 8) + 'px';
  ctx.style.top = Math.min(d.y, innerHeight - h - 8) + 'px';
  ctx.querySelectorAll('.ci').forEach(node => node.addEventListener('click', () => {
    const item = items[parseInt(node.dataset.i, 10)];
    ctx.classList.remove('show');
    if (item && item.fn) item.fn();
  }));
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Copied', 'ok')).catch(() => {});
  else toast('Copy not available', 'err');
}

function renderStorage() {
  const el = $('pane-storage');
  if (!el) return;
  const o = curOrigin() || '(none)';
  const cookies = [];
  for (const [host, bucket] of cookieJar.map) for (const [name, c] of bucket) cookies.push([host, name, c.v]);
  const ls = originStore.get(o, 'local');
  const ss = originStore.get(o, 'session');
  let html = `<h4 class="sec">Origin</h4><div class="kv"><span class="kk">origin</span><span class="vv">${esc(o)}</span></div>`;
  html += `<h4 class="sec">Cookies (${cookies.length})</h4>`;
  html += cookies.slice(0, 80).map(([h, n, v]) =>
    `<div class="kv"><span class="kk">${esc(h)} · ${esc(n)}</span><span class="vv">${esc(shortUrl(v, 40))}</span></div>`).join('') || '<div class="empty">none</div>';
  html += `<h4 class="sec">localStorage (${Object.keys(ls).length})</h4>`;
  html += Object.entries(ls).slice(0, 80).map(([k, v]) =>
    `<div class="kv"><span class="kk">${esc(k)}</span><span class="vv">${esc(shortUrl(v, 50))}</span></div>`).join('') || '<div class="empty">none</div>';
  html += `<h4 class="sec">sessionStorage (${Object.keys(ss).length})</h4>`;
  html += Object.entries(ss).slice(0, 40).map(([k, v]) =>
    `<div class="kv"><span class="kk">${esc(k)}</span><span class="vv">${esc(shortUrl(v, 50))}</span></div>`).join('') || '<div class="empty">none</div>';
  el.innerHTML = html;
}

    ${t('unblockMedia', 'Unblock media', 'Add controls/playsinline to media elements')}
    <h4 class="sec">Network</h4>
    ${t('cache', 'Memory cache', 'Cache GET resources for 60s')}
    ${t('persistCookies', 'Persist cookies', 'Keep the cookie jar in localStorage')}
    ${t('persistStorage', 'Persist storage', 'Keep localStorage/sessionStorage per origin')}

    <h4 class="sec">Identity</h4>

    <div style="display:flex;gap:6px;flex-wrap:wrap;padding:8px 6px">

    <input type="file" id="importFile" accept="application/json" class="hidden">`;

  el.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => {
    settings[cb.dataset.k] = cb.checked;
    saveSettings();
  }));
  el.querySelectorAll('input[type=text]').forEach(inp => inp.addEventListener('change', () => {
    let v = inp.value;
    if (inp.dataset.k === 'concurrency') v = Math.max(1, Math.min(24, parseInt(v, 10) || 8));
    settings[inp.dataset.k] = v;
    saveSettings();
    if (inp.dataset.k === 'gateway') toast('Gateway saved — reload to apply');
  }));
  $('clearCookies').addEventListener('click', () => { cookieJar.clear(); renderStorage(); toast('Cookies cleared'); });
  $('clearStorage').addEventListener('click', () => { const o = curOrigin(); if (o) originStore.clearOrigin(o); renderStorage(); toast('Storage cleared'); });
  $('clearCache').addEventListener('click', () => { memCache.clear(); toast('Cache cleared'); });
  $('exportData').addEventListener('click', exportData);
  $('importData').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', importData);
  $('clearAll').addEventListener('click', () => {
    if (!confirm('Reset all proxy data (cookies, storage, cache, bookmarks, history)?')) return;
    ['wp.cookies', 'wp.settings', 'wp.bookmarks', 'wp.history', 'wp.downloads', 'wp.lastUrl'].forEach(k => localStorage.removeItem(k));
    for (const k in localStorage) if (k.startsWith('wp.store:')) localStorage.removeItem(k);
    cookieJar.map.clear(); memCache.clear();
    toast('Everything reset', 'ok');
    setTimeout(() => location.reload(), 600);
  });
}

function exportData() {
  const dump = { build: BUILD, at: Date.now(), settings,
    bookmarks: loadJSON('wp.bookmarks', []), history: loadJSON('wp.history', null) };
  const name = 'warp-data-' + new Date().toISOString().slice(0, 10) + '.json';
  saveBlob(new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' }), name);
  toast('Exported ' + name, 'ok');
}
function importData(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (data.settings) { Object.assign(settings, data.settings); saveSettings(); }
      if (Array.isArray(data.bookmarks)) saveJSON('wp.bookmarks', data.bookmarks);
      if (data.history && Array.isArray(data.history.list)) { saveJSON('wp.history', data.history); restoreHistory(); }
      renderSettings(); renderQuick(); toast('Imported', 'ok');
    } catch { toast('Import failed', 'err'); }
  };
  r.readAsText(file);
}

/* ============================================================ KEYBOARD === */
function focusOmni() {
  if (home.classList.contains('hidden')) { omniInput.focus(); omniInput.select(); }
  else { homeInput.focus(); homeInput.select(); }
}
function handleKey(k) {
  const key = (k.key || '').toLowerCase();
  const mod = k.ctrl || k.meta;
  if (k.alt && k.key === 'ArrowLeft') goBack();
  else if (k.alt && k.key === 'ArrowRight') goForward();
  else if ((mod || k.alt) && key === 'r') { k.shift ? hardReload() : reload(); }
  else if (k.alt && key === 'home') showHome(true);
  else if ((mod || k.alt) && (key === 'l' || key === 'k')) focusOmni();
  else if (mod && key === 'd') toggleBookmark();
  else if (mod && key === 'f') openFind();
  else if (mod && key === 'u') viewSource();
  else if (mod && key === 's') { if (k.shift && window.wpSaveLauncher) window.wpSaveLauncher(); else savePageSource(); }
  else if (mod && (key === '=' || key === '+')) setZoom(state.zoom + 0.1);
  else if (mod && key === '-') setZoom(state.zoom - 0.1);
  else if (mod && key === '0') setZoom(1);
  else if (k.key === 'F12') toggleDevtools();
  else if (k.key === 'F1' || (k.key === '?' && k.shift)) openHelp();
  else if (k.key === 'Escape') {
    if ($('sheet').classList.contains('show')) closeSheet();
    else if (state.findOpen) closeFind();
    else if ($('ctx').classList.contains('show')) $('ctx').classList.remove('show');
    else if (document.body.classList.contains('devtools')) closeDevtools();
    else if (state.loading) stop();
    else if (!home.classList.contains('hidden') && state.hIndex >= 0 && view.classList.contains('on')) showHome(false);
  }
}

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  if (e.altKey || e.key === 'F12' || (mod && ['l', 'k', 'f', 'd', 'u', 's', '=', '+', '-', '0'].includes(key))) {
    e.preventDefault();
  }
  handleKey({ key: e.key, alt: e.altKey, ctrl: e.ctrlKey, meta: e.metaKey, shift: e.shiftKey });
});

$('errHome').addEventListener('click', () => { errpage.classList.remove('show'); showHome(true); });
$('errInfo').addEventListener('click', () => {
  if (state.lastError) openSheet('Error details', '<pre>' + esc(JSON.stringify(state.lastError, null, 2)) + '</pre>');
});

// drag & drop a URL / text onto the window
window.addEventListener('dragover', e => { e.preventDefault(); });
window.addEventListener('drop', e => {
  e.preventDefault();
  const txt = e.dataTransfer && (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain'));
  if (txt) { const t = normalizeInput(txt.split('\n')[0]); if (t) navigate(t); }
});

function showSiteInfo() {
  const m = state.currentMeta || {};
  const rows = [
    ['url', m.url || curUrl() || '(none)'],
    ['scheme', (m.url || curUrl() || '').split(':')[0] || '-'],
    ['status', m.status != null ? m.status : '-'],
    ['content-type', m.type || '-'],
    ['gateway', state.gateway || '-'],
    ['cookies for host', String(cookieJar.header(m.url || curUrl()).split('; ').filter(Boolean).length)],
    ['build', BUILD],
  ];
  openSheet('Site information',
    rows.map(([k, v]) => `<div class="kv"><span class="kk">${esc(k)}</span><span class="vv">${esc(String(v))}</span></div>`).join(''));
}

function openMenu() {
  const items = [
    { label: 'History', fn: renderHistorySheet },
    { label: 'Bookmarks', fn: renderBookmarksSheet },
    { label: 'Downloads', fn: renderDownloadsSheet },
    { label: 'View source', fn: viewSource },
    { label: 'Reader mode', fn: readerMode },
    { label: 'Save page source', fn: savePageSource },
    { label: 'Add to quick links', fn: addQuickLink },
    { label: 'Find in page', fn: openFind },
    { label: 'Site information', fn: showSiteInfo },
    { label: 'Keyboard shortcuts', fn: openHelp },
    { label: 'Toggle DevTools', fn: toggleDevtools },
    { label: 'Reset zoom', fn: () => setZoom(1) },
    { label: 'Clear cookies', fn: () => { cookieJar.clear(); toast('Cookies cleared'); } },
  ];
  const body = openSheet('Menu', items.map((i, n) => `<div class="mi" data-n="${n}">${esc(i.label)}</div>`).join(''));
  body.querySelectorAll('.mi').forEach(el => el.addEventListener('click', () => {
    closeSheet();
    items[parseInt(el.dataset.n, 10)].fn();
  }));
}

/* ================================================================ BOOT ==== */
function initialTarget() {
  const p = new URLSearchParams(location.search).get('url');
  const h = location.hash ? decodeURIComponent(location.hash.slice(1)) : '';
  const t = p || h;
  return t ? normalizeInput(t) : null;
}

function loadLibcurl() {
  return new Promise((resolve, reject) => {
    if (typeof libcurl === 'undefined') return reject(new Error('libcurl.js failed to load'));
    if (libcurl.ready) return resolve();
    const timer = setTimeout(() => reject(new Error('Timed out loading libcurl.wasm')), 30000);
    libcurl.onload = () => { clearTimeout(timer); resolve(); };
    try {
      const r = libcurl.load_wasm(LIBCURL_BASE + 'libcurl.wasm');
      if (r && typeof r.catch === 'function') r.catch(e => { clearTimeout(timer); reject(e); });
    } catch (e) { clearTimeout(timer); reject(e); }
  });
}

async function connectGateway() {
  const candidates = [settings.gateway, ...GATEWAYS].filter((v, i, a) => v && a.indexOf(v) === i);
  let lastErr = null;
  for (const gw of candidates) {
    try {
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('gateway timeout')), 8000);
        try {
          libcurl.set_websocket(gw);
          setTimeout(() => { clearTimeout(timer); resolve(); }, 120);
        } catch (e) { clearTimeout(timer); reject(e); }
      });
      state.gateway = gw;
      return gw;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('no gateway available');
}

window.addEventListener('load', async () => {
  homeInput.focus();
  try {
    const bms = loadJSON('wp.bookmarks', []);
    let dirty = false;
    bms.forEach(b => { if (b && b.url && (!b.name || /^warp( proxy)?$/i.test(String(b.name).trim()))) { b.name = hostOf(b.url); dirty = true; } });
    if (dirty) saveJSON('wp.bookmarks', bms);
  } catch {}
  restoreHistory();
  const z = loadJSON('wp.zoom', 1);
  if (z && z !== 1) setZoom(z);
  renderQuick();
  renderRecent();
  cookieJar.restore();
  try {
    const savedDl = loadJSON('wp.downloads', []);
    if (Array.isArray(savedDl)) state.downloads = savedDl.map(d => Object.assign({ url: '' }, d));
  } catch {}

  try {
    await loadLibcurl();
    await connectGateway();
    try { state.http = libcurl.HTTPSession ? new libcurl.HTTPSession() : libcurl; }
    catch { state.http = libcurl; }

    state.ready = true;
    $('homeGo').disabled = false;
    $('homeGo').textContent = 'Go';
    setStatus('Ready — gateway: ' + hostOf(state.gateway), 'ok');

    const saved = localStorage.getItem('wp.lastUrl');
    if (saved) homeInput.value = saved;

    const target = initialTarget();
    if (state.pendingBoot) { const p = state.pendingBoot; state.pendingBoot = null; navigate(p.target, p.opts); }
    else if (target) navigate(target);
  } catch (e) {
    $('homeGo').textContent = 'Retry';
    $('homeGo').disabled = false;
    setStatus('Boot failed: ' + e.message + ' — press Retry', 'err');
    $('homeForm').addEventListener('submit', () => location.reload(), { once: true });
  }
});

const _nav = navigate;
navigate = async function (t, o) {
  if (!t) return;
  try { localStorage.setItem('wp.lastUrl', t); } catch {}
  return _nav(t, o);
};

window.addEventListener('beforeunload', () => { cookieJar.persist(); saveSettings(); saveHistory(); });
window.addEventListener('resize', () => { renderInfo(); });

// light safety re-seed in case a frame misses its initial handshake
setInterval(() => { if (state.ready && !state.loading) seedFrame(); }, 4000);

window.wp = {
  navigate: (u) => navigate(normalizeInput(u)),
  settings, state,
  clearCookies: () => cookieJar.clear(),
  savePage: savePageSource,
  version: BUILD,
};
