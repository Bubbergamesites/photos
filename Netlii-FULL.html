        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            background-color: var(--body-bg);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.4s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        .glass-panel {
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            width: 85%;
            max-width: 600px;
            transition: background 0.4s ease;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 20px 0;
            letter-spacing: 10px;
            font-weight: 900;
        }

        .search-bar {
            width: 90%;
            padding: 15px 25px;
            border-radius: 50px;
            border: 2px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            font-size: 1.1rem;
            margin-bottom: 40px;
            outline: none;
            transition: border-color 0.4s ease;
        }

        .nav-row {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--text-color);
            text-decoration: none;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .nav-item:hover { transform: translateY(-5px); }

        .icon-circle {
            width: 60px;
            height: 60px;
            border: 2px solid var(--text-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .icon-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
        }

        #overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            z-index: 1001;
            user-select: none;
        }

        .close-btn:hover {
            color: var(--purple);
        }
    </style>

    <script>
        const overlay = document.getElementById('overlay');

        let currentBlobUrl = null;

        // Every open gets a brand-new iframe, so nothing from the previous
        // session (stale document, pending navigation) can leak into the next.
        function mountFrame() {
            const old = document.getElementById('overlay-frame');
            if (old) old.remove();
            if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
            const f = document.createElement('iframe');
            f.id = 'overlay-frame';
            overlay.appendChild(f);
            overlay.style.display = 'block';
            document.body.style.overflow = 'hidden';
            return f;
        }

        function openHTML(html) {
            mountFrame().srcdoc = html;
        }

0.1);\r\n        z-index: 1000;\r\n    }\r\n\r\n    .sidebar-btn {\r\n        background: var(--surface);\r\n        border: 1px solid rgba(255, 255, 255, 0.1);\r\n        color: white;\r\n        padding: 12px;\r\n        font-size: 18px;\r\n        font-weight: 900;\r\n        border-radius: var(--radius-sm);\r\n        cursor: pointer;\r\n        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);\r\n        text-align: center;\r\n    }\r\n\r\n    .sidebar-btn:hover:not(.empty) {\r\n        background: var(--primary);\r\n        color: black;\r\n        transform: translateX(5px);\r\n    }\r\n\r\n    .sidebar-btn.empty { opacity: 0.3; cursor: default; }\r\n\r\n    \/* Main Content *\/\r\n    .main-content {\r\n        margin-left: 100px;\r\n        flex: 1;\r\n        padding: 40px;\r\n    }\r\n\r\n    .search-container {\r\n        position: sticky;\r\n        top: 20px;\r\n        background: rgba(0, 0, 0, 0.3);\r\n        backdrop-filter: blur(15px);\r\n        padding: 20px;\r\n        z-index: 900;\r\n        border-radius: var(--radius-lg);\r\n        margin-bottom: 30px;\r\n        border: 1px solid rgba(255,255,255,0.1);\r\n    }\r\n\r\n    #gameSearch {\r\n        width: 100%;\r\n        box-sizing: border-box;\r\n        padding: 14px 25px;\r\n        font-size: 16px;\r\n        font-family: 'Nunito', sans-serif;\r\n        border-radius: 30px;\r\n        border: 1px solid rgba(255, 255, 255, 0.2);\r\n        background: rgba(255, 255, 255, 0.1);\r\n        color: white;\r\n        outline: none;\r\n    }\r\n\r\n    .letter-header {\r\n        font-weight: 900;\r\n        font-size: 42px;\r\n        border-bottom: 2px solid var(--primary);\r\n        margin: 40px 0 20px 0;\r\n        display: inline-block;\r\n    }\r\n\r\n    .buttons-container {\r\n        color\r\n        display: grid;\r\n        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));\r\n        gap: 15px;\r\n    }\r\n\r\n    .game-button {\r\n        background: var(--surface);   position: sticky;\r\n        top: 20px;\r\n        background: rgba(0, 0, 0, 0.3);\r\n        backdrop-filter: blur(15px);\r\n        padding: 20px;\r\n        z-index: 900;\r\n        border-radius: var(--radius-lg);\r\n        margin-bottom: 30px;\r\n        border: 1px solid rgba(255,255,255,0.1);\r\n    }\r\n\r\n    #gameSearch {\r\n        width: 100%;\r\n        box-sizing: border-box;\r\n        padding: 14px 25px;\r\n        font-size: 16px;\r\n        font-family: 'Nunito', sans-serif;\r\n        border-radius: 30px;\r\n        border: 1px solid rgba(255, 255, 255, 0.2);\r\n        background: rgba(255, 255, 255, 0.1);\r\n        color: white;\r\n        outline: none;\r\n    }\r\n\r\n    .letter-header {\r\n        font-weight: 900;\r\n        font-size: 42px;\r\n        border-bottom: 2px solid var(--primary);\r\n        margin: 40px 0 20px 0;\r\n        display: inline-block;\r\n    }\r\n\r\n    .buttons-container {\r\n        color\r\n        display: grid;\r\n        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));\r\n        gap: 15px;\r\n    }\r\n\r\n    .game-button {\r\n        background: var(--surface);\r\n        backdrop-filter: blur(5px);\r\n        border: 1px solid rgba(255, 255, 255, 0.1);\r\n        padding: 15px;\r\n        font-size: 14px;\r\n        font-weight: 700;\r\n        border-radius: var(--radius-sm);\r\n        cursor: pointer;\r\n        text-align: left;\r\n        transition: all 0.2s ease;\r\n        white-space: nowrap;\r\n        overflow: hidden;\r\n        text-overflow: ellipsis;\r\n    }\r\n\r\n    .game-button:hover {\r\n        background: var(--primary);\r\n        color: black;\r\n        transform: translateY(-3px);\r\n    }\r\n\r\n    \/* Modal Overlay *\/\r\n    .modal-overlay {\r\n        display: none;\r\n        position: fixed;\r\n        top: 0;\r\n        left: 0;\r\n        width: 100%;\r\n        height: 100%;\r\n        background: rgba(0, 0, 0, 0.85);\r\n        backdrop-filter: blur(12px);\r\n        z-index: 2000;\r\n        justify-content: center;\r\n        align-items: center;\r\n    }\r\n\r\n    .modal-content {\r\n        width: 95%;\r\n        height: 90%;\r\n        max-width: 1200px;\r\n        background: #000;\r\n        border-radius: var(--radius-lg);\r\n        display: flex;\r\n        flex-direction: column;\r\n        overflow: hidden;\r\n        border: 1px solid rgba(255, 255, 255, 0.2);\r\n        box-shadow: 0 20px 50px rgba(0,0,0,0.5);\r\n    }\r\n\r\n    .modal-header {\r\n        color: white;\r\n        padding: 15px 25px;\r\n        background: rgba(255,255,255,0.05);\r\n        display: flex;\r\n        justify-content: space-between;\r\n        align-items: center;\r\n        border-bottom: 1px solid rgba(255,255,255,0.1);\r\n    }\r\n\r\n    #modalTitle { font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }\r\n\r\n    .modal-controls { display: flex; gap: 10px; }\r\n\r\n    .ctrl-btn {\r\n        background: var(--surface);\r\n        border: none;\r\n        color: white;\r\n        padding: 8px 15px;\r\n        border-radius: 8px;\r\n        cursor: pointer;\r\n        font-weight: bold;\r\n        transition: 0.2s;\r\n    }\r\n\r\n    .ctrl-btn:hover { background: var(--primary); color: black; }\r\n    .close-btn { background: #ff4747; }\r\n    .close-btn:hover { background: #ff0000; color: white; }\r\n\r\n    .game-frame-container { flex: 1; position: relative; background: #111; }\r\n    #gameFrame { width: 100%; height: 100%; border: none; }\r\n<\/style>\r\n<\/head>\r\n\r\n<body>\r\n    <div class=\"sidebar\" id=\"sidebar\"><\/div>\r\n\r\n    <div class=\"main-content\">\r\n        <h1><span style=\"font-weight: 800\">NETLII <span style=\"font-weight: 400; opacity: 0.5;\">Apps<\/span><\/h1>\r\n        \r\n        <div class=\"search-container\">\r\n            <input type=\"text\" id=\"gameSearch\" placeholder=\"Search for a game...\" onkeyup=\"filterGames()\">\r\n        <\/div>\r\n\r\n        <div id=\"sections-container\"><\/div>\r\n    <\/div>\r\n\r\n    <div id=\"gameModal\" class=\"modal-overlay\">\r\n        <div class=\"modal-content\">\r\n            <div class=\"modal-header\">\r\n                <span id=\"modalTitle\">Loading...<\/span>\r\n                <div class=\"modal-controls\">\r\n                    <button onclick=\"openAboutBlank()\" class=\"ctrl-btn\">About:Blank<\/button>\r\n                    <button onclick=\"toggleFullscreen()\" class=\"ctrl-btn\">Fullscreen<\/button>\r\n                    <button onclick=\"closeModal()\" class=\"ctrl-btn close-btn\">\u2715<\/button>\r\n                <\/div>\r\n            <\/div>\r\n            <div class=\"game-frame-container\">\r\n                <iframe id=\"gameFrame\" allowfullscreen><\/iframe>\r\n            <\/div>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        \/\/ Data truncated for brevity - use your original massive list here\r\n    const files = [\r\n      \"amazon.com\",\r\n            \"canva.com\",\r\n            \"camdiv.com\",\r\n            \"chatgpt.com\",\r\n            \"crazygames.com\",\r\n            \"dailymotion.com\",\r\n            \"discord.gg\",\r\n            \"disneyplus.com\",\r\n            \"dropbox.com\",\r\n            \"ebay.com\",\r\n            \"fandom.com\",\r\n            \"freefy.app\",\r\n            \"gemini.google.com\",\r\n            \"github.com\",\r\n            \"google.com\",\r\n            \"hulu.com\",\r\n            \"hbomax.com\",\r\n            \"icloud.com\",\r\n            \"luna.amazon.com\",\r\n            \"netflix.com\", \r\n            \"omoggle.com\",\r\n            \"paramountplus.com\",\r\n            \"peacocktv.com\",\r\n            \"pinterest.com\",\r\n            \"play.fancade.com\", \r\n            \"pluto.tv\",\r\n            \"quora.com\",\r\n            \"soundcloud.com\",\r\n            \"spotify.com\",\r\n            \"tv.apple.com\",\r\n            \"twitch.tv\",\r\n            \"vimeo.com\",\r\n            \"wikipedia.org\",\r\n            \"y8.com\", \r\n            \"youtube.com\"\r\n     ];\r\nlet activeGameUrl = \"\";\r\n\r\n    function generateAllSections() {\r\n        const allChars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');\r\n        const filesByChar = {};\r\n        allChars.forEach(char => filesByChar[char] = []);\r\n\r\n        files.forEach(file => {\r\n            const firstChar = file.charAt(0).toUpperCase();\r\n            if (filesByChar[firstChar]) filesByChar[firstChar].push(file);\r\n        });\r\n\r\n        const container = document.getElementById('sections-container');\r\n        container.innerHTML = ''; \r\n\r\n        allChars.forEach(char => {\r\n            if (filesByChar[char].length === 0) return;\r\n\r\n            const section = document.createElement('div');\r\n            section.className = 'letter-section';\r\n            section.id = `section-${char}`;\r\n            \r\n            const header = document.createElement('div');\r\n            header.className = 'letter-header';\r\n            header.textContent = char;\r\n            section.appendChild(header);\r\n\r\n            const buttonsContainer = document.createElement('div');\r\n            buttonsContainer.className = 'buttons-container';\r\n\r\n            filesByChar[char].forEach(file => {\r\n                const btn = document.createElement('button');\r\n                btn.className = 'game-button';\r\n                btn.textContent = file;\r\n                btn.onclick = () => openGame(file);\r\n                buttonsContainer.appendChild(btn);\r\n            });\r\n\r\n            section.appendChild(buttonsContainer);\r\n            container.appendChild(section);\r\n        });\r\n        generateSidebar(allChars, filesByChar);\r\n    }\r\n\r\n    function openGame(file) {\r\n        const modal = document.getElementById('gameModal');\r\n        const frame = document.getElementById('gameFrame');\r\n        const title = document.getElementById('modalTitle');\r\n        const htmlContent = `<script src=\"https:\/\/cdn.jsdelivr.net\/gh\/bubbergamesites\/graggle\/hoss.js\"><\\\/script>`;\r\n        const blob = new Blob([htmlContent], {type: 'text\/html'});\r\n        const blobUrl = URL.createObjectURL(blob);\r\n        \/\/ Construct the direct URL for the iframe\r\n        activeGameUrl = `${blobUrl}#https:\/\/${encodeURIComponent(file)}`;\r\n        \r\n        title.textContent = file;\r\n        frame.src = activeGameUrl; \/\/ Set iframe source directly\r\n        modal.style.display = 'flex';\r\n    }\r\n\r\n    function closeModal() {\r\n        document.getElementById('gameModal').style.display = 'none';\r\n        document.getElementById('gameFrame').src = \"about:blank\"; \r\n    }\r\n\r\n    function toggleFullscreen() {\r\n        const frame = document.getElementById('gameFrame');\r\n        if (frame.requestFullscreen) frame.requestFullscreen();\r\n        else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();\r\n    }\r\n\r\n    function openAboutBlank() {\r\n        if (!activeGameUrl) return;\r\n        const win = window.open(\"about:blank\", \"_blank\");\r\n        if (win) {\r\n            win.document.write(`<iframe src=\"${activeGameUrl}\" style=\"position:fixed; top:0; left:0; bottom:0; right:0; width:100%; height:100%; border:none; margin:0; padding:0; overflow:hidden; z-index:999999;\"><\/iframe>`);\r\n        } else {\r\n            alert(\"Please allow popups.\");\r\n        }\r\n    }\r\n    function filterGames() {\r\n        const filter = document.getElementById('gameSearch').value.toLowerCase();\r\n        const sections = document.getElementsByClassName('letter-section');\r\n        for (let section of sections) {\r\n            const buttons = section.getElementsByClassName('game-button');\r\n            let match = false;\r\n            for (let btn of buttons) {\r\n                const isVisible = btn.textContent.toLowerCase().includes(filter);\r\n                btn.style.display = isVisible ? \"\" : \"none\";\r\n                if (isVisible) match = true;\r\n            }\r\n            section.style.display = match ? \"\" : \"none\";\r\n        }\r\n    }\r\n\r\n    function generateSidebar(allChars, filesByChar) {\r\n        const sidebar = document.getElementById('sidebar');\r\n        sidebar.innerHTML = '';\r\n        allChars.forEach(char => {\r\n            const btn = document.createElement('button');\r\n            btn.className = 'sidebar-btn';\r\n            btn.textContent = char;\r\n            if (filesByChar[char].length === 0) btn.classList.add('empty');\r\n            else btn.onclick = () => document.getElementById(`section-${char}`).scrollIntoView({behavior: 'smooth'});\r\n            sidebar.appendChild(btn);\r\n        });\r\n    }\r\n\r\n    window.addEventListener('DOMContentLoaded', generateAllSections);\r\n<\/script>\r\n<\/body>\r\n<\/html>");
        }

ding: 0;\r\n            box-sizing: border-box;\r\n        }\r\n\r\n        body {\r\n            margin: 0;\r\n            font-family: 'Nunito', sans-serif;\r\n            background-color: var(--body-bg);\r\n            background-image: var(--bg-image);\r\n            background-repeat: no-repeat;\r\n            background-position: center center;\r\n            background-attachment: fixed;\r\n            background-size: cover;\r\n            min-height: 100vh;\r\n            color: var(--accent);\r\n            display: flex;\r\n            flex-direction: column;\r\n            align-items: center;\r\n            transition: background 0.4s ease, color 0.4s ease;\r\n        }\r\n\r\n        .container {\r\n            width: 100%;\r\n            max-width: 1400px;\r\n            padding: 40px 20px;\r\n        }\r\n\r\n        .header {\r\n            text-align: center;\r\n            margin-bottom: 50px;\r\n        }\r\n\r\n        .header h1 {\r\n            font-size: 3.5rem;\r\n            letter-spacing: 12px;\r\n            font-weight: 900;\r\n            text-transform: uppercase;\r\n            margin-bottom: 30px;\r\n            color: var(--accent);\r\n        }\r\n\r\n        .search-container {\r\n            max-width: 600px;\r\n            margin: 0 auto 30px;\r\n        }\r\n\r\n        .search-input {\r\n            width: 100%;\r\n            height: 54px;\r\n            border-radius: 50px;\r\n            border: 2px solid var(--accent);\r\n            padding: 0 25px;\r\n            background: var(--glass);\r\n            color: var(--accent);\r\n            font-size: 1rem;\r\n            font-weight: 700;\r\n            outline: none;\r\n            transition: 0.3s;\r\n        }\r\n\r\n        .filter-buttons {\r\n            display: flex;\r\n            gap: 12px;\r\n            justify-content: center;\r\n            flex-wrap: wrap;\r\n            margin-bottom: 40px;\r\n        }\r\n\r\n        .filter-btn {\r\n            padding: 12px 25px;\r\n            border-radius: 50px;\r\n            border: 2px solid var(--accent);\r\n            background: var(--glass);\r\n            color: var(--accent);\r\n            font-weight: 800;\r\n            cursor: pointer;\r\n            transition: 0.2s;\r\n            text-transform: uppercase;\r\n        }\r\n\r\n        .filter-btn.active,\r\n        .filter-btn:hover {\r\n            background: var(--accent);\r\n            color: var(--body-bg);\r\n        }\r\n\r\n        .movies-grid {\r\n            display: grid;\r\n            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));\r\n            gap: 30px;\r\n        }\r\n\r\n        .movie-card {\r\n            background: var(--glass);\r\n            backdrop-filter: blur(15px);\r\n            -webkit-backdrop-filter: blur(15px);\r\n            border: 2px solid var(--accent);\r\n            border-radius: 25px;\r\n            overflow: hidden;\r\n            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);\r\n            cursor: pointer;\r\n        }\r\n\r\n        .movie-card:hover {\r\n            transform: translateY(-10px);\r\n        }\r\n\r\n        .movie-poster {\r\n            width: 100%;\r\n            aspect-ratio: 2\/3;\r\n            object-fit: cover;\r\n            border-bottom: 2px solid var(--accent);\r\n        }\r\n\r\n        .movie-info {\r\n            padding: 20px;\r\n            text-align: center;\r\n        }\r\n\r\n        .movie-title {\r\n            font-size: 1.1rem;\r\n            font-weight: 900;\r\n            margin-bottom: 5px;\r\n            color: var(--accent);\r\n        }\r\n\r\n        .movie-date {\r\n            font-size: 0.85rem;\r\n            font-weight: 700;\r\n            opacity: 0.6;\r\n            color: var(--accent);\r\n        }\r\n\r\n        .movie-rating {\r\n            color: var(--accent);\r\n            font-weight: 900;\r\n            margin-top: 5px;\r\n        }\r\n\r\n        .player-container {\r\n            position: fixed;\r\n            inset: 0;\r\n            background: rgba(0, 0, 0, 0.98);\r\n            z-index: 9999;\r\n            display: none;\r\n            flex-direction: column;\r\n        }\r\n\r\n        .player-container.show {\r\n            display: flex;\r\n        }\r\n\r\n        .player-header {\r\n            padding: 20px;\r\n            background: var(--body-bg);\r\n            border-bottom: 2px solid var(--accent);\r\n            display: flex;\r\n            justify-content: space-between;\r\n            align-items: center;\r\n            position: relative;\r\n            flex-wrap: wrap;\r\n            gap: 15px;\r\n        }\r\n\r\n        .player-title {\r\n            color: var(--accent);\r\n            font-weight: 900;\r\n            font-size: 1.5rem;\r\n            max-width: 40%;\r\n            white-space: nowrap;\r\n            overflow: hidden;\r\n            text-overflow: ellipsis;\r\n        }\r\n\r\n        .player-controls-wrapper {\r\n            display: flex;\r\n            align-items: center;\r\n            gap: 15px;\r\n            flex-grow: 1;\r\n            justify-content: center;\r\n        }\r\n\r\n        .tv-controls {\r\n            display: none;\r\n            gap: 10px;\r\n            align-items: center;\r\n        }\r\n\r\n        .server-controls {\r\n            display: flex;\r\n            align-items: center;\r\n            gap: 5px;\r\n        }\r\n\r\n        .close-btn {\r\n            background: var(--accent);\r\n            color: var(--body-bg);\r\n            border: none;\r\n            width: 45px;\r\n            height: 45px;\r\n            border-radius: 50%;\r\n            cursor: pointer;\r\n            display: flex;\r\n            align-items: center;\r\n            justify-content: center;\r\n            font-weight: bold;\r\n        }\r\n\r\n        .player-wrapper {\r\n            flex: 1;\r\n            padding: 20px;\r\n            background: #000;\r\n            display: flex;\r\n            justify-content: center;\r\n        }\r\n\r\n        iframe {\r\n            width: 100%;\r\n            max-width: 1200px;\r\n            height: 100%;\r\n            border: 3px solid #fff;\r\n            border-radius: 20px;\r\n        }\r\n\r\n        #pagination button {\r\n            padding: 10px 25px;\r\n            border-radius: 50px;\r\n            border: 2px solid var(--accent);\r\n            background: var(--glass);\r\n            color: var(--accent);\r\n            font-weight: 900;\r\n            cursor: pointer;\r\n            margin: 0 10px;\r\n        }\r\n\r\n        #pagination button:disabled {\r\n            opacity: 0.3;\r\n        }\r\n\r\n        select.filter-btn {\r\n            padding: 5px 15px;\r\n            height: auto;\r\n            font-size: 0.9rem;\r\n            outline: none;\r\n        }\r\n\r\n        select.filter-btn option {\r\n            background: var(--body-bg);\r\n            color: var(--accent);\r\n        }\r\n    <\/style>\r\n<\/head>\r\n\r\n<body>\r\n    <div style=\"position:fixed;top:15px;left:15px;z-index:9999;font-size:8px;color:var(--accent);max-width:380px;line-height:1.4;opacity:0.5;\">\r\n        Disclaimer: This website doesn't host any files.\r\n    <\/div>\r\n\r\n    <div class=\"container\">\r\n        <div class=\"header\">\r\n            <h1>Movies & TV Shows<\/h1>\r\n            <div class=\"search-container\">\r\n                <input type=\"text\" class=\"search-input\" id=\"searchInput\" placeholder=\"Search movies and TV shows...\">\r\n            <\/div>\r\n            <div class=\"filter-buttons\">\r\n                <button class=\"filter-btn active\" data-filter=\"popular\">Popular<\/button>\r\n                <button class=\"filter-btn\" data-filter=\"trending\">Trending<\/button>\r\n                <button class=\"filter-btn\" data-filter=\"top_rated\">Top Rated<\/button>\r\n                <button class=\"filter-btn\" data-filter=\"now_playing\">Now Playing<\/button>\r\n                <button class=\"filter-btn\" data-filter=\"upcoming\">Upcoming<\/button>\r\n            <\/div>\r\n        <\/div>\r\n        <div id=\"loading\" style=\"text-align: center; padding: 50px; font-size: 20px; display: none;\">Loading...<\/div>\r\n        <div id=\"moviesGrid\" class=\"movies-grid\"><\/div>\r\n        <div id=\"pagination\"><\/div>\r\n    <\/div>\r\n\r\n    <div class=\"player-container\" id=\"playerContainer\">\r\n        <div class=\"player-header\">\r\n            <div class=\"player-title\" id=\"playerTitle\">Loading...<\/div>\r\n\r\n            <div class=\"player-controls-wrapper\">\r\n                <div id=\"tv-controls\" class=\"tv-controls\">\r\n                    <select id=\"seasonSelect\" class=\"filter-btn\"><\/select>\r\n                    <select id=\"episodeSelect\" class=\"filter-btn\"><\/select>\r\n                <\/div>\r\n\r\n                <div class=\"server-controls\">\r\n                    <select id=\"serverSelect\" class=\"filter-btn\">\r\n                        <option value=\"vidrock\">Server 1 (VidRock)<\/option>\r\n                        <option value=\"cinezo\">Server 2 (Cinezo)<\/option>\r\n                        <option value=\"vidfast\">Server 3 (Vidfast)<\/option>\r\n                        <option value=\"videasy\">Server 4 (Videasy)<\/option>\r\n                        <option value=\"111movies\">Server 5 (111movies)<\/option>\r\n                    <\/select>\r\n                <\/div>\r\n            <\/div>\r\n\r\n            <button class=\"close-btn\" id=\"closeBtn\">X<\/button>\r\n        <\/div>\r\n        <div class=\"player-wrapper\">\r\n            <iframe id=\"playerIframe\" frameborder=\"0\" allow=\"autoplay; encrypted-media; fullscreen\" allowfullscreen=\"\"><\/iframe>\r\n        <\/div>\r\n    <\/div>\r\n\r\n    <script>\r\n        \/\/ Movie API Logic\r\n        const k = \"2713804610e1e236b1cf44bfac3a7776\",\r\n            b = \"https:\/\/api.themoviedb.org\/3\",\r\n            i = \"https:\/\/image.tmdb.org\/t\/p\/w500\";\r\n        let f = \"popular\",\r\n            p = 1,\r\n            t = null,\r\n            s = null;\r\n        const l = document.getElementById('loading'),\r\n            g = document.getElementById('moviesGrid'),\r\n            q = document.getElementById('searchInput'),\r\n            fb = document.querySelectorAll('.filter-btn'),\r\n            pc = document.getElementById('playerContainer'),\r\n            ifm = document.getElementById('playerIframe'),\r\n            pt = document.getElementById('playerTitle'),\r\n            cb = document.getElementById('closeBtn'),\r\n            srvSel = document.getElementById('serverSelect');\r\n\r\n        let currentType = 'movie';\r\n        let currentId = null;\r\n\r\n        load();\r\n\r\n        fb.forEach(x => {\r\n            if (x.tagName === 'BUTTON') {\r\n                x.onclick = () => {\r\n                    fb.forEach(y => y.classList.remove('active'));\r\n                    x.classList.add('active');\r\n                    f = x.dataset.filter;\r\n                    p = 1;\r\n                    load()\r\n                }\r\n            }\r\n        });\r\n\r\n        q.oninput = e => {\r\n            clearTimeout(s);\r\n            let v = e.target.value.trim();\r\n            if (!v) {\r\n                p = 1;\r\n                load();\r\n                return\r\n            }\r\n            s = setTimeout(() => search(v), 600)\r\n        };\r\n        cb.onclick = () => {\r\n            pc.classList.remove('show');\r\n            ifm.src = '';\r\n            t = null;\r\n        };\r\n\r\n        \/\/ Server switcher tracking trigger\r\n        srvSel.onchange = () => {\r\n            const sSel = document.getElementById('seasonSelect');\r\n            const eSel = document.getElementById('episodeSelect');\r\n            const season = sSel.value || 1;\r\n            const episode = eSel.value || 1;\r\n\r\n            if (currentId) {\r\n                updatePlayer(currentType, currentId, season, episode);\r\n            }\r\n        };\r\n\r\n        function load() {\r\n            l.style.display = 'block';\r\n            g.innerHTML = '';\r\n            let u = f === 'popular' ? `${b}\/movie\/popular?api_key=${k}&page=${p}` :\r\n                f === 'trending' ? `${b}\/trending\/all\/day?api_key=${k}&page=${p}` :\r\n                f === 'top_rated' ? `${b}\/movie\/top_rated?api_key=${k}&page=${p}` :\r\n                f === 'now_playing' ? `${b}\/movie\/now_playing?api_key=${k}&page=${p}` :\r\n                `${b}\/movie\/upcoming?api_key=${k}&page=${p}`;\r\n            fetch(u).then(r => r.json()).then(d => show(d.results, d.total_pages))\r\n        }\r\n\r\n        function search(v) {\r\n            l.style.display = 'block';\r\n            g.innerHTML = '';\r\n            fetch(`${b}\/search\/multi?api_key=${k}&query=${encodeURIComponent(v)}&page=${p}`).then(r => r.json()).then(d => show(d.results, d.total_pages))\r\n        }\r\n\r\n        function show(m, tp) {\r\n            l.style.display = 'none';\r\n            g.innerHTML = '';\r\n            if (!m.length) {\r\n                g.innerHTML = '<div style=\"grid-column:1\/-1;text-align:center;padding:50px\">No results found.<\/div>';\r\n                return\r\n            }\r\n            m.forEach(mv => {\r\n                if (!mv.poster_path) return;\r\n                let c = document.createElement('div');\r\n                c.className = 'movie-card';\r\n                let im = document.createElement('img');\r\n                im.className = 'movie-poster';\r\n                im.src = i + mv.poster_path;\r\n                im.alt = mv.title || mv.name;\r\n                let inf = document.createElement('div');\r\n                inf.className = 'movie-info';\r\n                let ti = document.createElement('div');\r\n                ti.className = 'movie-title';\r\n                ti.textContent = mv.title || mv.name;\r\n                let dt = document.createElement('div');\r\n                dt.className = 'movie-date';\r\n                dt.textContent = mv.release_date || mv.first_air_date || '\u2014';\r\n                let ra = document.createElement('div');\r\n                ra.className = 'movie-rating';\r\n                ra.textContent = `\u2b50 ${mv.vote_average?mv.vote_average.toFixed(1):'\u2014'}`;\r\n                inf.append(ti, dt, ra);\r\n                c.append(im, inf);\r\n                c.onclick = () => open(mv);\r\n                g.appendChild(c)\r\n            });\r\n            if (tp > 1) pag(tp)\r\n        }\r\n\r\n        function pag(tp) {\r\n            let d = document.createElement('div');\r\n            d.style.cssText = 'display:flex;justify-content:center;gap:15px;margin:30px 0';\r\n            let prev = document.createElement('button');\r\n            prev.textContent = 'Previous';\r\n            prev.disabled = p === 1;\r\n            prev.onclick = () => {\r\n                if (p > 1) {\r\n                    p--;\r\n                    q.value ? search(q.value) : load();\r\n                    scrollTo(0, 0)\r\n                }\r\n            }\r\n            let next = document.createElement('button');\r\n            next.textContent = 'Next';\r\n            next.disabled = p === tp;\r\n            next.onclick = () => {\r\n                if (p < tp) {\r\n                    p++;\r\n                    q.value ? search(q.value) : load();\r\n                    scrollTo(0, 0)\r\n                }\r\n            }\r\n            let info = document.createElement('span');\r\n            info.textContent = `Page ${p} \/ ${tp}`;\r\n            info.style.cssText = 'padding:10px 20px'\r\n            d.append(prev, info, next);\r\n            document.getElementById('pagination').innerHTML = '';\r\n            document.getElementById('pagination').appendChild(d)\r\n        }\r\n\r\n        function open(mv) {\r\n            t = mv;\r\n            pt.textContent = mv.title || mv.name;\r\n            pc.classList.add('show');\r\n\r\n            const tvControls = document.getElementById('tv-controls');\r\n\r\n            let type = mv.media_type;\r\n            if (!type) {\r\n                type = mv.name ? 'tv' : 'movie';\r\n            }\r\n\r\n            currentType = type;\r\n            currentId = mv.id;\r\n\r\n            if (type === 'tv') {\r\n                tvControls.style.display = 'flex';\r\n                setupTvSelectors(mv.id);\r\n                updatePlayer('tv', mv.id, 1, 1);\r\n            } else {\r\n                tvControls.style.display = 'none';\r\n                updatePlayer('movie', mv.id);\r\n            }\r\n        }\r\n\r\n        \/\/ Modified function to update player based on Server Selection\r\n        function updatePlayer(type, id, s = 1, e = 1) {\r\n            const selectedServer = srvSel.value;\r\n\r\n            if (selectedServer === 'vidfast') {\r\n                if (type === 'tv') {\r\n                    ifm.src = `https:\/\/vidfast.pro\/tv\/${id}\/${s}\/${e}`;\r\n                } else {\r\n                    ifm.src = `https:\/\/vidfast.pro\/movie\/${id}`;\r\n                }\r\n            }\r\n            else if (selectedServer === 'cinezo') {\r\n                if (type === 'tv') {\r\n                    ifm.src = `https:\/\/api.cinezo.net\/tv\/${id}\/${s}\/${e}`;\r\n                } else {\r\n                    ifm.src = `https:\/\/api.cinezo.net\/movie\/${id}`;\r\n                }\r\n            } else if (selectedServer === 'videasy') {\r\n                if (type === 'tv') {\r\n                    ifm.src = `https:\/\/player.videasy.net\/tv\/${id}\/${s}\/${e}`;\r\n                } else {\r\n                    ifm.src = `https:\/\/player.videasy.net\/movie\/${id}`;\r\n                }\r\n            } else if (selectedServer === '111movies') {\r\n                if (type === 'tv') {\r\n                    ifm.src = `https:\/\/111movies.net\/tv\/${id}&tmdb=1&s=${s}&e=${e}`;\r\n                } else {\r\n                    ifm.src = `https:\/\/111movies.net\/movie\/${id}&tmdb=1`;\r\n                }\r\n            }\r\n            else {\r\n                \/\/ Default VidRock Structures\r\n                if (type === 'tv') {\r\n                    ifm.src = `https:\/\/vidrock.ru\/tv\/${id}\/${s}\/${e}`;\r\n                } else {\r\n                    ifm.src = `https:\/\/vidrock.ru\/movie\/${id}`;\r\n                }\r\n            }\r\n        }\r\n\r\n        \/\/ Fetch TV details to populate Season\/Episode dropdowns\r\n        async function setupTvSelectors(id) {\r\n            const sSel = document.getElementById('seasonSelect');\r\n            const eSel = document.getElementById('episodeSelect');\r\n\r\n            const res = await fetch(`${b}\/tv\/${id}?api_key=${k}`);\r\n            const data = await res.json();\r\n\r\n            sSel.innerHTML = '';\r\n            data.seasons.forEach(s => {\r\n                if (s.season_number === 0) return; \/\/ Skip specials\r\n                sSel.innerHTML += `<option value=\"${s.season_number}\">Season ${s.season_number}<\/option>`;\r\n            });\r\n\r\n            \/\/ When season changes, update episodes\r\n            sSel.onchange = () => updateEpisodes(id, sSel.value);\r\n\r\n            \/\/ Initial load for Season 1\r\n            updateEpisodes(id, 1);\r\n        }\r\n\r\n        async function updateEpisodes(id, sNum) {\r\n            const eSel = document.getElementById('episodeSelect');\r\n            const res = await fetch(`${b}\/tv\/${id}\/season\/${sNum}?api_key=${k}`);\r\n            const data = await res.json();\r\n\r\n            eSel.innerHTML = '';\r\n            data.episodes.forEach(e => {\r\n                eSel.innerHTML += `<option value=\"${e.episode_number}\">Ep ${e.episode_number}: ${e.name}<\/option>`;\r\n            });\r\n\r\n            eSel.onchange = () => updatePlayer('tv', id, sNum, eSel.value);\r\n        }\r\n    <\/script>\r\n\r\n<\/body>\r\n\r\n<\/html>");
        }

        function openUrl(url, blobUrl) {
            const f = mountFrame();
            currentBlobUrl = blobUrl || null;
            f.src = url;
        }

        function closeProject() {
            const old = document.getElementById('overlay-frame');
            if (old) old.remove();
            if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
            overlay.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Search Logic
        const homeSearch = document.getElementById('home-search');
        function search(query) {
            const htmlContent = `<script src="https://cdn.jsdelivr.net/gh/bubbergamesites/graggle/hoss.js"><\/script>`;
            const blob = new Blob([htmlContent], {
                type: 'text/html'
            });
            const blobUrl = URL.createObjectURL(blob);
            const searchEngine = "https://search.brave.com/search?q=";
            if (query.includes('.') && !query.includes(' ')) {
                let url = query;
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                openUrl(`${blobUrl}#${url}`, blobUrl);
            } else {
                openUrl(`${blobUrl}#${searchEngine}${encodeURIComponent(query)}`, blobUrl);
            }
        }

        homeSearch.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = homeSearch.value.trim();
                if (query) search(query);
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeProject();
        });
    </script>
</body>
</html>
